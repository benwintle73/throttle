<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Weather</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --g1:#FFD166; --g2:#FF8A5B; --g3:#FF5E7E;
    --glass:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.28);
    --text:#fff;
    --soft:rgba(255,255,255,.78);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:clip;max-width:100%;touch-action:pan-y;-webkit-text-size-adjust:100%}
  .hourly,.chips{touch-action:pan-x pan-y}
  input,textarea,select{font-size:16px!important}
  .app{overflow-x:clip}
  input,select,textarea{max-width:100%}
  body{
    font-family:'Outfit',system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:var(--g3);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background .6s ease;
  }
  .bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 100%)}

  /* sky scene: sun/moon arc from left horizon to right horizon */
  .scene{position:absolute;top:0;left:0;right:0;height:360px;overflow:hidden;z-index:0;pointer-events:none}
  .horizon-glow{position:absolute;left:-10%;right:-10%;bottom:-60px;height:140px;border-radius:50%;filter:blur(30px);opacity:0;transition:opacity 3s,background 3s}
  .sun{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;transition:left 3s linear,top 3s linear,opacity 3s,box-shadow 3s,background 3s}
  .moon{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    box-shadow:0 0 30px 8px rgba(255,244,200,.35),0 0 90px 30px rgba(255,244,200,.12);
    transition:left 3s linear,top 3s linear,opacity 3s}
  .stars{position:absolute;inset:0;transition:opacity 3s;opacity:0}
  .sun,.moon{opacity:0}
  .stars i{position:absolute;border-radius:50%;background:#fff;animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.35}}
  .cloud{position:absolute;height:34px;border-radius:999px;filter:blur(1.5px);transition:opacity 3s,background 3s;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:'';position:absolute;border-radius:50%;background:inherit}
  .cloud::before{width:48%;height:180%;left:16%;bottom:20%}
  .cloud::after{width:36%;height:140%;left:50%;bottom:25%}
  @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}
  .precip{position:absolute;inset:0;opacity:0;transition:opacity 3s}
  .precip.rain{background:repeating-linear-gradient(105deg,transparent 0 27px,rgba(255,255,255,.45) 27px 28px);background-size:80px 90px;animation:fall .9s linear infinite}
  .precip.snow{background-image:radial-gradient(circle,#fff 1.5px,transparent 2px),radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px);background-size:46px 46px,30px 30px;animation:snowfall 6s linear infinite}
  @keyframes fall{to{background-position:-24px 90px}}
  @keyframes snowfall{to{background-position:20px 184px,-10px 120px}}

  .app{
    position:relative;z-index:1;max-width:480px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 32px);
  }

  /* top bar */
  .top{display:flex;align-items:center;gap:10px}
  .place{flex:1;min-width:0}
  .place h1{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
  .place p{font-size:13px;color:var(--soft);margin-top:1px}
  .icon-btn{
    width:42px;height:42px;border-radius:14px;border:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0;
    transition:transform .15s,background .2s;
  }
  .icon-btn:active{transform:scale(.92)}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn.on svg{fill:#fff}
  .icon-btn.here{background:rgba(255,255,255,.4)}

  .chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;padding:7px 14px;border-radius:999px;font:500 13px 'Outfit',sans-serif;
    border:1px solid var(--line);background:var(--glass);color:#fff;cursor:pointer;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .chip.active{background:#fff;color:#333}

  /* hero */
  .hero{text-align:center;padding:30px 0 6px;text-shadow:0 2px 20px rgba(0,0,0,.22)}
  .temp{font-size:104px;font-weight:300;line-height:1;letter-spacing:-5px;margin-top:4px}
  .temp sup{font-size:44px;vertical-align:top;position:relative;top:12px;letter-spacing:0;margin-left:4px}
  .cond{font-size:21px;font-weight:500;margin-top:6px}
  .hilo{font-size:15px;color:var(--soft);margin-top:4px}

  /* cards */
  .card{
    background:var(--glass);border:1px solid var(--line);border-radius:26px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    padding:16px;margin-top:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
  }
  .card h2{font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--soft);margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .card h2 svg{width:14px;height:14px}

  .hourly{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;scroll-snap-type:x proximity}
  .hourly::-webkit-scrollbar{display:none}
  .hour{flex-shrink:0;width:58px;text-align:center;padding:10px 0;border-radius:18px;scroll-snap-align:start}
  .hour.now{background:rgba(255,255,255,.22)}
  .hour .t{font-size:13px;color:var(--soft);font-weight:500}
  .hour .i{width:34px;height:34px;margin:8px auto 4px}
  .hour .p{font-size:11px;color:#CFF1FF;font-weight:600;height:14px}
  .hour .v{font-size:17px;font-weight:600;margin-top:2px}

  .day{display:grid;grid-template-columns:54px 34px 38px 1fr 34px;align-items:center;gap:8px;padding:9px 0}
  .day + .day{border-top:1px solid rgba(255,255,255,.14)}
  .day .n{font-weight:500;font-size:16px}
  .day .i{width:30px;height:30px}
  .day .p{font-size:12px;color:#CFF1FF;font-weight:600;text-align:center}
  .day .lo{color:var(--soft);text-align:right;font-size:16px}
  .day .hi{font-weight:600;font-size:16px;text-align:right}
  .range{position:relative;height:6px;border-radius:6px;background:rgba(0,0,0,.12);margin:0 4px}
  .range span{position:absolute;top:0;bottom:0;border-radius:6px}
  .range .dot{width:10px;height:10px;top:-2px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.15)}
  .day-row{display:contents}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .grid .card{margin:0;padding:14px 16px}
  .stat .v{font-size:30px;font-weight:500;letter-spacing:-.5px;line-height:1.1}
  .stat .v small{font-size:16px;font-weight:400;margin-left:2px}
  .stat .s{font-size:13px;color:var(--soft);margin-top:6px;line-height:1.35}
  .meter{height:6px;border-radius:6px;margin-top:10px;background:linear-gradient(90deg,#5BE37D,#FFE14D,#FF9F43,#FF5E5E,#B266FF);position:relative}
  .meter i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.2);transform:translateX(-50%)}
  .compass{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.35);position:relative;margin-top:2px;float:right;margin-left:6px}
  .compass b{position:absolute;inset:0;display:grid;place-items:center;transition:transform .6s}
  .compass b svg{width:22px;height:22px}
  .compass em{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;font-style:normal;font-weight:700;color:var(--soft)}

  .foot{text-align:center;font-size:12px;color:var(--soft);margin-top:22px}
  .wear{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
  .wear span{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid var(--line);font-size:13px;font-weight:500;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-shadow:none}
  .nowcast .msg{font-size:17px;font-weight:600;margin-bottom:12px}
  .rain-sum{display:flex;gap:18px;margin-bottom:14px}
  .rain-sum div{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .rain-sum b{display:block;font-size:24px;color:#fff;letter-spacing:0;text-transform:none;font-weight:600;margin-top:2px}
  .rain-sum b small{font-size:13px;font-weight:500;margin-left:2px}
  .rchart{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:150px;padding-top:4px;
    background:repeating-linear-gradient(180deg,transparent 0 36px,rgba(255,255,255,.14) 36px 37px)}
  .rcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .rcol em{font-style:normal;font-size:12px;font-weight:700;margin-bottom:4px;white-space:nowrap}
  .rcol i{width:100%;border-radius:7px 7px 3px 3px;background:rgba(255,255,255,.2);min-height:4px}
  .rcol i.l{background:linear-gradient(180deg,#B6EEFF,#6CC8F7)}
  .rcol i.m{background:linear-gradient(180deg,#6CC8F7,#2F86E8)}
  .rcol i.h{background:linear-gradient(180deg,#5E7BFF,#3A2FC8)}
  .rtimes{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px;text-align:center;font-size:11px;color:var(--soft);font-weight:600}
  .rkey{display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--soft)}
  .rkey span{display:inline-flex;align-items:center;gap:5px}
  .rkey span::before{content:'';width:10px;height:10px;border-radius:3px;background:var(--k)}
  .totd .q{font-size:19px;line-height:1.4;font-weight:500}
  .totd .by{margin-top:10px;font-size:13px;color:var(--soft);font-weight:500}
  body.neon .totd{background:linear-gradient(155deg,#FFB347 0%,#FF5E8A 55%,#C13AD9 100%)}
  body.neon .totd .q{font-family:'Anton',sans-serif;font-weight:400;font-size:24px;line-height:1.25;letter-spacing:.3px;text-transform:uppercase;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
  body.neon .totd .by{color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;font-size:11px}
  /* ===== account ===== */
  .icon-btn{position:relative}
  .acct-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#2EE68A;box-shadow:0 0 0 2px rgba(0,0,0,.15);display:none}
  .acct-dot.on{display:block}
  .acct-card{background:rgba(255,255,255,.97);color:#222;border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .acct-card h3{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
  .acct-card h3 .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:#f0eef6;display:grid;place-items:center;cursor:pointer}
  .acct-card h3 .x svg{width:16px;height:16px}
  .acct-card p.sub{font-size:14px;color:#666;margin:6px 0 16px;line-height:1.4}
  .acct-tabs{display:flex;background:#f0eef6;border-radius:12px;padding:4px;margin-bottom:14px}
  .acct-tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:600 14px 'Outfit',sans-serif;color:#666;cursor:pointer}
  .acct-tabs button.on{background:#fff;color:#222;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .acct-card label{display:block;font-size:12px;font-weight:600;color:#666;margin:10px 0 5px;text-transform:uppercase;letter-spacing:.8px}
  .acct-card input{width:100%;height:48px;border-radius:12px;border:1.5px solid #e2dfeb;padding:0 14px;font:500 16px 'Outfit',sans-serif;outline:none;background:#fff;color:#222}
  .acct-card input:focus{border-color:#8a6cff}
  .acct-card .btn-p{width:100%;height:50px;margin-top:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#6A5AE0,#3A7BD5);color:#fff;font:600 16px 'Outfit',sans-serif;cursor:pointer}
  .acct-card .btn-p:disabled{opacity:.6}
  .acct-card .btn-s{width:100%;height:46px;margin-top:10px;border:1.5px solid #e2dfeb;border-radius:14px;background:#fff;color:#333;font:600 15px 'Outfit',sans-serif;cursor:pointer}
  .acct-card .link{display:block;margin:14px auto 0;border:0;background:none;color:#6A5AE0;font:600 14px 'Outfit',sans-serif;cursor:pointer}
  .acct-card .err{color:#D63B5C;font-size:14px;margin-top:10px;font-weight:500}
  .acct-card .ok{color:#178A5B;font-size:14px;margin-top:10px;font-weight:500}
  .acct-card .who{background:#f6f4fb;border-radius:14px;padding:14px;font-size:15px}
  .acct-card .who b{display:block;font-size:16px;word-break:break-all}
  .acct-card .who small{color:#777;font-size:13px}
  .acct-card .sw-row{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:15px;font-weight:600;color:#222;text-transform:none;letter-spacing:0;margin:0}
  .sw-row span{flex:1}
  .sw-row small{display:block;font-size:12px;font-weight:500;color:#777;margin-top:2px}
  .sw-row input{display:none}
  .sw-row .sw{width:50px;height:30px;border-radius:999px;background:#d9d6e3;position:relative;flex-shrink:0;transition:background .2s}
  .sw-row .sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
  .sw-row input:checked + .sw{background:#2EC27E}
  .sw-row input:checked + .sw::after{transform:translateX(20px)}
  .appear{margin-top:18px;padding-top:16px;border-top:1px solid #eee}
  .appear h4{font-size:12px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
  .appear .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .appear button{border:2px solid #e2dfeb;border-radius:14px;padding:0;overflow:hidden;background:#fff;cursor:pointer;text-align:left;font:600 14px 'Outfit',sans-serif;color:#333}
  .appear button.on{border-color:#6A5AE0;box-shadow:0 0 0 3px rgba(106,90,224,.18)}
  .appear button i{display:block;height:54px}
  .appear button span{display:flex;align-items:center;justify-content:space-between;padding:8px 10px}
  .appear button span b{width:18px;height:18px;border-radius:50%;border:2px solid #ccc}
  .appear button.on span b{border:5px solid #6A5AE0}
  .appear .pv-classic{background:linear-gradient(180deg,#4C9FEE,#8ACAF4 60%,#FFE1A4)}
  .appear .pv-neon{background:linear-gradient(180deg,#5B0E91,#FF2E9A 60%,#FF9A3D);position:relative}
  .appear .pv-neon::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(180deg,#2EE6D6,#0B6E8C)}
  body.neon .appear button{border-radius:2px}
  body.neon .acct-card{border-radius:3px;border:3px solid #000;box-shadow:8px 8px 0 #FF2E9A}
  body.neon .acct-card .btn-p{border-radius:2px;background:#000;font-family:'Anton',sans-serif;font-weight:400;letter-spacing:1px;text-transform:uppercase;font-size:18px}
  body.neon .acct-card input,body.neon .acct-card .btn-s,body.neon .acct-tabs,body.neon .acct-tabs button{border-radius:2px}

  .mv{position:relative;margin-top:14px;animation:jig .26s ease-in-out infinite alternate;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .mv:nth-child(even){animation-delay:-.13s;animation-direction:alternate-reverse}
  .mv > *{pointer-events:none;margin-top:0!important}
  .mv.dragging{animation:none;z-index:25;filter:drop-shadow(0 16px 26px rgba(0,0,0,.35))}
  @keyframes jig{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
  #content > section.card,#content > section.grid{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .edit-done{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(120px);z-index:40;
    border:0;border-radius:999px;padding:14px 34px;background:#fff;color:#222;font:700 16px 'Outfit',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .25s;cursor:pointer}
  .edit-done.show{transform:translateX(-50%) translateY(0)}
  body.neon .edit-done{border-radius:2px;background:#000;color:#fff;border:2px solid #fff;font-family:'Anton',sans-serif;font-weight:400;letter-spacing:1px;text-transform:uppercase}
  .refresh-wrap .refresh + .refresh{margin-left:8px}
  /* ===== to-do ===== */
  .tp{position:fixed;inset:0;z-index:30;background:rgba(12,10,30,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;transition:opacity .25s;padding:calc(env(safe-area-inset-top) + 12px) 12px 0}
  .tp.open{opacity:1;pointer-events:auto}
  .tp-in{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
  .tp .pz-head h3{flex:1;font-size:22px;font-weight:700}
  .tp .pz-head small{display:block;font-size:13px;color:var(--soft);font-weight:500}
  .tp-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 2px calc(env(safe-area-inset-bottom) + 40px)}
  body.neon .tp{background:rgba(7,7,7,.92)}
  body.neon .tp .pz-head h3{font-family:'Anton',sans-serif;font-weight:400;font-size:26px;letter-spacing:1px;text-transform:uppercase}
  .todo-card{cursor:pointer}
  .todo-card .row{display:flex;align-items:center;gap:14px}
  .todo-card .ring{width:46px;height:46px;flex-shrink:0}
  .todo-card .t1{font-size:18px;font-weight:600}
  .todo-card .t2{font-size:13px;color:var(--soft);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .todo-card .mid{flex:1;min-width:0}
  .todo-card .go{padding:9px 16px;border-radius:999px;background:#fff;color:#333;font-weight:600;font-size:14px;flex-shrink:0}
  body.neon .todo-card{background:linear-gradient(150deg,#7B3FF0,#E0368F)}
  body.neon .todo-card .t1{font-family:'Anton',sans-serif;font-weight:400;font-size:22px;letter-spacing:.5px;text-transform:uppercase}
  body.neon .todo-card .go{border-radius:2px;background:#000;color:#fff;border:2px solid #fff;text-transform:uppercase;font-weight:800;font-size:12px;letter-spacing:1px}
  .todo .top-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .todo .ask{font-size:17px;font-weight:600}
  .todo .prog{font-size:13px;color:var(--soft);font-weight:600}
  .todo .bar{height:6px;border-radius:6px;background:rgba(0,0,0,.15);overflow:hidden;margin-bottom:12px}
  .todo .bar i{display:block;height:100%;background:linear-gradient(90deg,#2EE6A8,#14C8B4);border-radius:6px;transition:width .3s}
  .todo .items{display:flex;flex-direction:column;gap:6px}
  .todo .it{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 10px 10px 12px}
  .todo .ck{width:24px;height:24px;border-radius:7px;border:2px solid rgba(255,255,255,.75);flex-shrink:0;display:grid;place-items:center;cursor:pointer;background:none;padding:0}
  .todo .ck svg{width:14px;height:14px;opacity:0}
  .todo .it.done .ck{background:#14C8B4;border-color:#14C8B4}
  .todo .it.done .ck svg{opacity:1}
  .todo .tx{flex:1;min-width:0;font-size:15px;font-weight:500;word-break:break-word}
  .todo .it.done .tx{text-decoration:line-through;opacity:.6}
  .todo .tx small{display:inline-block;font-size:11px;color:#fff;background:rgba(255,140,40,.85);border-radius:6px;padding:1px 7px;font-weight:700;margin-top:4px;text-decoration:none}
  .todo .del{border:0;background:none;color:#fff;opacity:.55;font-size:17px;cursor:pointer;padding:2px 4px;flex-shrink:0}
  .todo form{display:flex;gap:8px;margin-top:10px}

  .sheet{position:fixed;inset:0;z-index:10;background:rgba(20,10,40,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet.open{opacity:1;pointer-events:auto}
  .panel{
    max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;
    transform:translateY(-16px);transition:transform .25s;
  }
  .sheet.open .panel{transform:none}
  .search{display:flex;gap:10px}
  .search input{
    flex:1;height:48px;border-radius:16px;border:1px solid var(--line);
    background:rgba(255,255,255,.95);color:#222;font:500 16px 'Outfit',sans-serif;padding:0 16px;outline:none;
  }
  .results{margin-top:12px;background:rgba(255,255,255,.96);border-radius:20px;overflow:hidden;color:#222}
  .results:empty{display:none}
  .res{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px}
  .res + .res{border-top:1px solid #eee}
  .res:hover{background:#f6f3ff}
  .res b{font-weight:600}
  .res small{display:block;color:#777;font-size:13px}
  .res svg{width:18px;height:18px;flex-shrink:0;color:#8a6cff}

  .loading .hero,.loading .card{opacity:.55}
  .err{text-align:center;padding:60px 20px;font-size:16px}
  .err button{margin-top:16px}
  .btn{padding:12px 20px;border-radius:14px;border:0;background:#fff;color:#333;font:600 15px 'Outfit',sans-serif;cursor:pointer}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
const DEFAULT_PLACE = { name:'Maryborough', sub:'Victoria, Australia', lat:-37.0457, lon:143.7393 };

/* ---------- storage (safe) ---------- */
const SYNC_KEYS = ['wx_saved','wx_last','wx_neon','wx_pz_stats','wx_todo','wx_order'];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v, quiet){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} if (!quiet && SYNC_KEYS.includes(k) && window.syncSoon) window.syncSoon(); }
};
let saved = store.get('wx_saved', [DEFAULT_PLACE]);
let current = store.get('wx_last', DEFAULT_PLACE);

/* ---------- weather codes ---------- */
function kind(code){
  if (code === 0) return 'clear';
  if (code === 1 || code === 2) return 'partly';
  if (code === 3) return 'cloudy';
  if (code === 45 || code === 48) return 'fog';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if (code >= 95) return 'storm';
  return 'cloudy';
}
const LABELS = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Icy fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',
  85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Storm with hail',99:'Storm with hail'};


/* ---------- icons ---------- */
const SUN = (cx=32,cy=32,r=11)=>{
  let rays='';
  for(let a=0;a<360;a+=45){const t=a*Math.PI/180;
    rays+=`<line x1="${cx+Math.cos(t)*(r+5)}" y1="${cy+Math.sin(t)*(r+5)}" x2="${cx+Math.cos(t)*(r+10)}" y2="${cy+Math.sin(t)*(r+10)}"/>`;}
  return `<g stroke="#FFD43B" stroke-width="4" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#sunG)"/>`;
};
const MOON = `<path d="M40 10a20 20 0 1 0 14 34A17 17 0 0 1 40 10z" fill="url(#moonG)"/>`;
const CLOUD = (fill='#fff', ty=0) => `<path transform="translate(0 ${ty})" d="M18 50h29a11 11 0 0 0 1.5-21.9A15 15 0 0 0 20.2 26 12 12 0 0 0 18 50z" fill="${fill}"/>`;
const DEFS = `<defs>
  <linearGradient id="sunG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE66D"/><stop offset="1" stop-color="#FFB627"/></linearGradient>
  <linearGradient id="moonG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6C8"/><stop offset="1" stop-color="#F5D97A"/></linearGradient>
</defs>`;

function icon(code, isDay){
  const k = kind(code);
  let s = DEFS;
  if (k === 'clear') s += isDay ? SUN() : MOON;
  else if (k === 'partly') s += (isDay ? `<g transform="translate(-6 -8) scale(.85)">${SUN()}</g>` : `<g transform="translate(-8 -8) scale(.75)">${MOON}</g>`) + CLOUD('#fff', 6);
  else if (k === 'cloudy') s += `<g transform="translate(14 -8) scale(.8)">${CLOUD('#E3EBFF')}</g>` + CLOUD('#fff', 4);
  else if (k === 'fog') s += CLOUD('#fff', -6) + `<g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"><line x1="12" y1="52" x2="52" y2="52"/><line x1="18" y1="59" x2="46" y2="59"/></g>`;
  else if (k === 'rain') s += CLOUD('#fff', -8) + `<g stroke="#7FD8FF" stroke-width="4" stroke-linecap="round"><line x1="22" y1="48" x2="19" y2="56"/><line x1="33" y1="48" x2="30" y2="58"/><line x1="44" y1="48" x2="41" y2="56"/></g>`;
  else if (k === 'snow') s += CLOUD('#fff', -8) + `<g fill="#fff"><circle cx="21" cy="52" r="3"/><circle cx="32" cy="57" r="3"/><circle cx="43" cy="52" r="3"/></g>`;
  else if (k === 'storm') s += CLOUD('#E7E1FF', -8) + `<path d="M34 42l-9 13h7l-4 10 12-15h-7l5-8z" fill="#FFD43B"/>`;
  return `<svg viewBox="0 0 64 64" width="100%" height="100%">${s}</svg>`;
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const r0 = n => Math.round(n);
const compassDir = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
const fmtTime = iso => {
  const [h,m] = iso.slice(11,16).split(':').map(Number);
  return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'am':'pm'}`;
};
const fmtHour = iso => { const h = Number(iso.slice(11,13)); return `${(h%12)||12}${h<12?'am':'pm'}`; };
const dayName = (iso, i) => i===0 ? 'Today' : new Date(iso+'T12:00:00').toLocaleDateString('en-AU',{weekday:'short'});
function uvLabel(u){ return u<3?'Low':u<6?'Moderate':u<8?'High':u<11?'Very high':'Extreme'; }


/* ---------- data ---------- */
async function getWeather(p){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}`
   + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation`
   + `&hourly=temperature_2m,weather_code,precipitation_probability,is_day`
   + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max`
   + `&minutely_15=precipitation&forecast_minutely_15=10`
   + `&timezone=auto&forecast_days=7`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Weather unavailable');
  return res.json();
}

let lastFetch = 0, busy = false;
const REFRESH_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>`;
let queued = null;
async function load(p, quiet=false){
  if (busy){ queued = [p, quiet]; return; } busy = true;
  current = p; store.set('wx_last', p);
  if (!quiet) $('app').classList.add('loading');
  $('placeName').textContent = p.name;
  $('placeSub').textContent = p.sub || '';
  renderChips(); renderSave();
  try{
    const d = await getWeather(p);
    lastFetch = Date.now();
    render(d);
  }catch(e){
    if (!lastData || !quiet)
      $('content').innerHTML = `<div class="err">Couldn't load the weather.<br><button class="btn" onclick="load(current)">Try again</button></div>`;
  }
  $('app').classList.remove('loading');
  busy = false;
  if (queued){ const q = queued; queued = null; load(q[0], q[1]); }
}
async function refreshNow(){
  const b = $('refreshBtn'); if (b) b.classList.add('spinning');
  await load(current, true);
}

/* ---------- render ---------- */
function render(d){
  const c = d.current, h = d.hourly, dy = d.daily;
  lastData = d;

  // hourly: from current hour, 24 entries
  const nowKey = c.time.slice(0,13);
  let start = h.time.findIndex(t => t.slice(0,13) >= nowKey); if(start<0) start=0;
  let hours = '';
  for(let i=start;i<Math.min(start+24,h.time.length);i++){
    const p = h.precipitation_probability[i];
    hours += `<div class="hour ${i===start?'now':''}">
      <div class="t">${i===start?'Now':fmtHour(h.time[i])}</div>
      <div class="i">${i===start?icon(c.weather_code,c.is_day):icon(h.weather_code[i], h.is_day[i])}</div>
      <div class="p">${p>=20?p+'%':''}</div>
      <div class="v">${r0(i===start?c.temperature_2m:h.temperature_2m[i])}°</div>
    </div>`;
  }

  // daily with range bars
  const wkMin = Math.min(...dy.temperature_2m_min), wkMax = Math.max(...dy.temperature_2m_max);
  const span = Math.max(1, wkMax - wkMin);
  let days = '';
  dy.time.forEach((t,i)=>{
    const lo = dy.temperature_2m_min[i], hi = dy.temperature_2m_max[i];
    const L = (lo-wkMin)/span*100, W = (hi-lo)/span*100;
    const p = dy.precipitation_probability_max[i];
    const dot = i===0 ? `<span class="dot" style="left:calc(${Math.min(100,Math.max(0,(c.temperature_2m-wkMin)/span*100))}% - 5px)"></span>` : '';
    days += `<div class="day">
      <div class="n">${dayName(t,i)}</div>
      <div class="i">${icon(dy.weather_code[i],1)}</div>
      <div class="p">${p>=20?p+'%':''}</div>
      <div style="display:grid;grid-template-columns:30px 1fr;align-items:center;gap:6px">
        <div class="lo">${r0(lo)}°</div>
        <div class="range"><span style="left:${L}%;width:${Math.max(W,4)}%;background:linear-gradient(90deg,${tempColor(lo)},${tempColor(hi)})"></span>${dot}</div>
      </div>
      <div class="hi">${r0(hi)}°</div>
    </div>`;
  });

  const uv = dy.uv_index_max[0] ?? 0;
  const arrow = `<svg viewBox="0 0 24 24"><path d="M12 2l5 14-5-3-5 3z" fill="#fff"/></svg>`;

  const SECTIONS = {
    thought: thoughtCard(), todo: todoCard(), puzzle: puzzleCard(), rain: nowcastCard(d),
    hourly: `<section class="card hourly-card">
      <h2>${svgClock()} Next 24 hours</h2>
      <div class="hourly">${hours}</div>
    </section>`,
    daily: `<section class="card daily-card">
      <h2>${svgCal()} 7-day forecast</h2>
      ${days}
    </section>`,
    details: `<section class="grid">
      <div class="card stat">
        <h2>Wind</h2>
        <div class="compass"><em>N</em><b style="transform:rotate(${(c.wind_direction_10m+180)%360}deg)">${arrow}</b></div>
        <div class="v">${r0(c.wind_speed_10m)}<small>km/h</small></div>
        <div class="s">${compassDir(c.wind_direction_10m)} · gusts ${r0(c.wind_gusts_10m)}</div>
      </div>
      <div class="card stat">
        <h2>UV index</h2>
        <div class="v">${r0(uv)}</div>
        <div class="s">${uvLabel(uv)}</div>
        <div class="meter"><i style="left:${Math.min(100,uv/11*100)}%"></i></div>
      </div>
      <div class="card stat">
        <h2>Humidity</h2>
        <div class="v">${r0(c.relative_humidity_2m)}<small>%</small></div>
        <div class="s">${humidityNote(c.relative_humidity_2m)}</div>
      </div>
      <div class="card stat">
        <h2>Rain today</h2>
        <div class="v">${(dy.precipitation_sum[0]??0).toFixed(1)}<small>mm</small></div>
        <div class="s">${dy.precipitation_probability_max[0] ?? 0}% chance</div>
      </div>
      <div class="card stat">
        <h2>Sunrise</h2>
        <div class="v" style="font-size:24px">${fmtTime(dy.sunrise[0])}</div>
        <div class="s">Sunset ${fmtTime(dy.sunset[0])}</div>
      </div>
      <div class="card stat">
        <h2>Moon</h2>
        <div class="moon-ico">${moonSVG(moonPhase().f, current.lat)}</div>
        <div class="v">${moonPhase().illum}<small>%</small></div>
        <div class="s">${moonPhase().name}</div>
      </div>
    </section>`
  };
  const cardsHTML = layoutHTML(SECTIONS);

  $('content').innerHTML = `
    <section class="hero" id="hero">
      <div class="temp">${r0(c.temperature_2m)}<sup>°</sup></div>
      <div class="cond">${LABELS[c.weather_code] || '—'}</div>
      <div class="hilo">H ${r0(dy.temperature_2m_max[0])}°  ·  L ${r0(dy.temperature_2m_min[0])}°  ·  Feels like ${r0(c.apparent_temperature)}°</div>
      <div class="wear">${wearTips(d, start).map(t=>`<span>${t}</span>`).join('')}</div>
    </section>

    ${cardsHTML}

    <div class="refresh-wrap"><button class="refresh" id="refreshBtn" onclick="refreshNow()">${REFRESH_SVG} Refresh</button></div>
    <p class="foot" style="margin-top:10px">Tip: hold a card to rearrange</p>
    <p class="foot">Updated ${new Date(lastFetch).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})} · Data by <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></p>
  `;
  buildClouds(kind(c.weather_code));
  updateSky();
}

/* ---------- living sky ---------- */
let lastData = null;
// Sky colours (top, middle, horizon) keyed by day progress: 0 = sunrise, 1 = sunset.
const SKY = [
  [-0.16, ['#0A0F26','#151A40','#2A2763']],
  [-0.06, ['#1E2561','#56398A','#C95A7C']],
  [ 0.02, ['#4558A8','#EE877F','#FFC46C']],
  [ 0.14, ['#4C9FEE','#8ACAF4','#FFE1A4']],
  [ 0.50, ['#2D89EA','#56B2F4','#A4DCFF']],
  [ 0.86, ['#3986DE','#86BAEE','#FFD298']],
  [ 0.98, ['#3B3E92','#E05F7C','#FF995A']],
  [ 1.06, ['#1E2161','#5A2E7E','#B4446F']],
  [ 1.16, ['#0A0F26','#151A40','#2A2763']],
];
const NEON_SKY = [
  [-0.16, ['#0D0221','#26083F','#541066']],
  [-0.06, ['#1B0638','#6E1B72','#FF3E8A']],
  [ 0.02, ['#3A1C71','#D9567E','#FFAF6B']],
  [ 0.14, ['#1FC8D6','#86DDEB','#FFBC8F']],
  [ 0.50, ['#10CFF5','#7FE3FC','#FFC1E3']],
  [ 0.86, ['#2C9BFF','#B98BFF','#FF9C8C']],
  [ 0.98, ['#5B0E91','#FF2E9A','#FF9A3D']],
  [ 1.06, ['#2A0845','#921F80','#FF4F81']],
  [ 1.16, ['#0D0221','#26083F','#541066']],
];
let neon = store.get('wx_neon', false);
function applyMode(){
  document.body.classList.toggle('neon', neon);
  renderChips();
  updateSky();
}
function buildSkyline(){
  // original generic skyline: deterministic block towers with lit windows
  let x = 0, svg = '', win = '', i = 0;
  const W = 400, H = 64;
  while (x < W){
    const w = 14 + ((i*37)%22), h = 18 + ((i*53)%40), top = H - h;

const hex2rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex = a => '#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix = (a,b,t) => { const A=hex2rgb(a),B=hex2rgb(b); return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t)); };

function mute(hex, amt){ // desaturate + dim for overcast skies
  const [r,g,b] = hex2rgb(hex), l = (.3*r+.59*g+.11*b)*.88;

function skyAt(p){
  const K = neon ? NEON_SKY : SKY;
  if (p <= K[0][0] || p >= K[K.length-1][0]) return K[0][1];
  for (let i=0;i<K.length-1;i++){
    const [p0,c0] = K[i], [p1,c1] = K[i+1];
    if (p >= p0 && p <= p1){ const t=(p-p0)/(p1-p0); return c0.map((c,j)=>mix(c,c1[j],t)); }

// Actual moon rise/set for the location (SunCalc). q is 0 at moonrise and 1 at moonset.
function moonArc(lat, lon){
  if (!window.SunCalc || lat == null) return null;
  const now = new Date(), ev = [];
  for (const off of [-1, 0, 1]){
    const d = new Date(now); d.setDate(d.getDate() + off); d.setHours(12, 0, 0, 0);
    const t = SunCalc.getMoonTimes(d, lat, lon);
    if (t.rise) ev.push({ k: 'r', t: +t.rise }); if (t.set) ev.push({ k: 's', t: +t.set });
  }
  ev.sort((a, b) => a.t - b.t);
  if (SunCalc.getMoonPosition(now, lat, lon).altitude <= 0) return { up: false };
  let rise = null; ev.forEach(e => { if (e.k === 'r' && e.t <= +now) rise = e.t; });
  const set = ev.find(e => e.k === 's' && e.t > +now);
  if (!rise || !set) return { up: true, q: .5 };
  return { up: true, q: (+now - rise) / (set.t - rise) };
}
const parseLocal = s => Date.parse(s + ':00Z'); // location-local wall time as a UTC timestamp
function updateSky(){
  const d = lastData; if (!d) return;
  const dy = d.daily;
  const now = Date.now() + (d.utc_offset_seconds||0)*1000;
  const today = new Date(now).toISOString().slice(0,10);
  let i = dy.time.indexOf(today); if (i < 0) i = 0;
  const rise = parseLocal(dy.sunrise[i]), set = parseLocal(dy.sunset[i]);
  const p = (now - rise) / (set - rise);

  // moon progress across the night
  let q = -1;
  if (now > set){ const next = dy.sunrise[i+1] ? parseLocal(dy.sunrise[i+1]) : rise + 864e5; q = (now - set)/(next - set); }
  else if (now < rise){ const prev = set - 864e5; q = (now - prev)/(rise - prev); }

  const k = kind(d.current.weather_code);
  const cloud = CLOUDINESS[k] ?? 0;
  const night = p < 0 ? clamp(-p/0.08) : p > 1 ? clamp((p-1)/0.08) : 0;
  const elev = clamp(Math.sin(Math.PI*p));

  // sky gradient
  const cols = skyAt(p).map(c => mute(c, neon ? cloud*.6 : cloud));
  const r = document.documentElement.style;
  r.setProperty('--g1', cols[0]); r.setProperty('--g2', cols[1]); r.setProperty('--g3', cols[2]);
  document.querySelector('meta[name=theme-color]').setAttribute('content', cols[0]);

  // arc geometry
  const hero = document.getElementById('hero');
  const scene = $('scene');

  if (neon && hero){
    const rc = hero.getBoundingClientRect();
    Object.assign(scene.style, {top:(rc.top+scrollY)+'px', left:rc.left+'px', right:'auto', width:rc.width+'px', height:rc.height+'px'});
    W = rc.width; H = rc.height*0.8;                       // horizon line where sky meets sea
    const sea = $('sea'); sea.style.top = H+'px';
    $('skyline').style.top = (H-70)+'px'; $('skyline').style.bottom = 'auto';
    const seaTop = mix(mix(cols[2], '#2EE6D6', .55), '#2A0F4A', night*.8);
    const seaBot = mix('#0B6E8C', '#08061A', night*.9);
    sea.style.background = `linear-gradient(180deg, ${seaTop} 0%, ${seaBot} 100%)`;
  } else {
    Object.assign(scene.style, {left:'0', right:'0', width:'', top:'0'});
    H = hero ? hero.getBoundingClientRect().bottom + window.scrollY : 360;
    scene.style.height = H + 'px';
    W = scene.clientWidth;
  }
  const place = (el, t) => {
    el.style.left = (W*(0.07 + t*0.86)) + 'px';
    el.style.top  = (H - Math.sin(Math.PI*t)*(H - (neon ? 95 : Math.max(165, H * 0.42)))) + 'px';   // peak sits below the header, visible
  };

  // sun: deep orange at the horizon, pale gold overhead
  const sun = $('sun');
  if (p > -0.2 && p < 1.2){
    place(sun, p);
    const core = mix('#FF7A3D', '#FFF6CF', Math.pow(elev, .55));
    const glow = mix('#FF5E3A', '#FFE27A', elev);
    if (neon){
      sun.style.width = sun.style.height = '92px'; sun.style.margin = '-46px 0 0 -46px';
      sun.style.webkitMaskImage = sun.style.maskImage = ''; sun.style.filter = '';
      sun.style.background = `radial-gradient(circle, #FFFFF4 0%, #FFF3C4 38%, ${mix('#FF5A3C','#FFD36B',elev)} 72%, ${mix('#FF2E7A','#FFB347',elev)} 100%)`;
      sun.style.boxShadow = `0 0 50px 20px ${mix('#FF4F7B','#FFD36B',elev)}bb, 0 0 160px 80px ${mix('#FF3E8A','#FFB347',elev)}55, 0 0 320px 160px #FF5FA222`;
    } else {
      sun.style.width = sun.style.height = ''; sun.style.margin = '';
      sun.style.webkitMaskImage = sun.style.maskImage = ''; sun.style.filter = '';
      sun.style.background = `radial-gradient(circle at 50% 50%, #FFFDF2 0%, ${core} 55%, ${glow} 100%)`;
      sun.style.boxShadow = `0 0 40px 12px ${glow}cc, 0 0 120px 50px ${glow}55, 0 0 240px 120px ${glow}22`;
    }
    sun.style.opacity = 1 - cloud*0.85;
  } else sun.style.opacity = 0;

  // horizon glow around sunrise/sunset
  const twilight = clamp(1 - Math.min(Math.abs(p), Math.abs(p-1)) / 0.12);
  const hg = $('hglow');
  hg.style.background = `radial-gradient(ellipse at ${p < .5 ? '15%' : '85%'} 50%, ${neon ? '#FF2E9A' : '#FF8A50'}, transparent 70%)`;
  hg.style.opacity = neon ? Math.max(.35, twilight) * (1 - cloud*.5) : twilight * (1 - cloud) * 0.85;
  const wl = document.getElementById('winLights'); if (wl) wl.style.opacity = .25 + night*.75;
  if (neon){
    const g = $('glint');
    const src = (p > -0.05 && p < 1.05) ? p : (q >= 0 ? q : -1);
    if (src >= 0){
      g.style.left = (W*(0.07 + src*0.86)) + 'px';
      g.style.setProperty('--glint', night > .5 ? '#FFF4C8' : mix('#FF7A50', '#FFF1B8', elev));
      g.style.opacity = (1 - cloud) * (night > .5 ? .45 : .85);
    } else g.style.opacity = 0;
  }

  // moon + stars
  const moon = $('moon');
  const mp = moonPhase(), dk = night.toFixed(1);
  if (moon.dataset.f !== mp.f.toFixed(3) + dk){ moon.innerHTML = moonSVG(mp.f, current.lat, night); moon.dataset.f = mp.f.toFixed(3) + dk; }
  moon.style.boxShadow = night > .3 ? `0 0 30px 8px rgba(255,244,200,${.35*mp.illum/100}),0 0 90px 30px rgba(255,244,200,${.12*mp.illum/100})` : 'none';
  const ma = moonArc(current.lat, current.lon);
  if (ma && ma.up){
    // real position: from its actual rise to its actual set; faint in daylight like the real thing
    place(moon, Math.min(.97, Math.max(.03, ma.q)));

  } else if (!ma && q >= 0){ place(moon, q); moon.style.opacity = night * (1 - cloud*0.7); }
  else moon.style.opacity = 0;
  $('stars').style.opacity = night * (1 - cloud*1.4);

  // clouds tint with the sky
  const cloudCol = mix(mix('#FFFFFF', cols[1], .25), '#3A3F5C', night*.75);
  const darker = (k==='rain'||k==='storm') ? .35 : 0;
  document.querySelectorAll('.cloud').forEach(c => {

    c.style.opacity = k==='clear' ? 0 : k==='partly' ? .75 : .92;
  });
  // normal mode: no falling rain/snow overlay (clouds and greyer sky show the weather); Neon Coast keeps it
  $('precip').style.opacity = (k==='rain'||k==='storm'||k==='snow') ? (neon ? .3 : .22) : 0;   // subtle in both looks
}

/* ---------- thought of the day ---------- */
// One per day, changes at local midnight. Shuffled order with no repeats until the whole list is used.
function thoughtOfTheDay(){
  // Morning thought until midday, afternoon/evening thought after. Each pool gets its own
  // shuffle per calendar year, so with 366+ in each pool nothing repeats within a year.
  const all = window.THOUGHTS || []; if (!all.length) return null;
  const now = new Date(), y = now.getFullYear(), pm = now.getHours() >= 12;
  const list = all.filter(t => t.w === (pm ? 'pm' : 'am'));
  const pool = list.length ? list : all;
  const doy = Math.round((new Date(y, now.getMonth(), now.getDate()) - new Date(y, 0, 1)) / 864e5);
  const n = pool.length;
  let seed = (y * 2654435761 + (pm ? 7919 : 97)) >>> 0;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const order = [...Array(n).keys()];
  for (let i = n-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [order[i],order[j]] = [order[j],order[i]]; }
  return pool[order[doy % n]];
}
function thoughtCard(){
  const t = thoughtOfTheDay(); if (!t) return '';
  const h = new Date().getHours();
  const when = h < 12 ? 'Morning thought' : h < 17 ? 'Afternoon thought' : 'Evening thought';
  const q = t.t === 'q' ? `“${t.x}”` : t.x;
  const by = t.t === 'q' ? `<div class="by">— ${t.by}</div>` : '';
  return `<section class="card totd">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg> ${when}</h2>
    <div class="q">${q}</div>
    ${by}
  </section>`;
}

// Signed in: the Daily Word lives on the server — the word, guess checking, timing and scoring all happen there,
// so results can't be faked. Signed out: a local practice puzzle that never touches the leaderboard.
const PZ_EPOCH = new Date(2026, 10, 20);                 // puzzle #1
function localDay(d = new Date()){ return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(2000,0,1)) / 864e5); }
function puzzleToday(){                                   // practice word (local)
  const A = window.PUZZLE_ANSWERS || []; if (!A.length) return null;
  const now = new Date(), y = now.getFullYear();
  const doy = Math.round((new Date(y, now.getMonth(), now.getDate()) - new Date(y,0,1)) / 864e5);
  let seed = (y * 2246822519 + 31) >>> 0;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const o = [...Array(A.length).keys()];
  for (let i = o.length-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [o[i],o[j]] = [o[j],o[i]]; }
  const num = Math.round((new Date(y, now.getMonth(), now.getDate()) - PZ_EPOCH) / 864e5) + 1;
  return { word: A[o[doy % A.length]], day: localDay(now), num };
}
function pzStats(){ return store.get('wx_pz_stats', { played:0, wins:0, streak:0, best:0, lastWin:null, dist:[0,0,0,0,0,0] }); }
function score(guess, word){
  const res = Array(5).fill('a'), left = {};
  for (let i=0;i<5;i++){ if (guess[i] === word[i]) res[i] = 'c'; else left[word[i]] = (left[word[i]]||0) + 1; }
  for (let i=0;i<5;i++){ if (res[i] !== 'c' && left[guess[i]] > 0){ res[i] = 'p'; left[guess[i]]--; } }
  return res.join('');
}
const serverMode = () => !!(sb && user);
function pzCached(){ const c = store.get('wx_pz_srv', null); return c && c.day === localDay() ? c : null; }
function fromServer(d){
  const c = pzCached() || {};
  return { day:d.day, num:d.num, guesses:d.guesses||[], pats:d.patterns||[], done:!!d.done, won:!!d.won, word:d.word,
           score:d.score, seconds:d.seconds, legacy:!!d.legacy, legacyGuesses:d.legacy_guesses, rank:c.rank, players:c.players };
}
function pzState(){
  const t = puzzleToday(); if (!t) return null;
  if (serverMode()){
    const c = pzCached() || { day: t.day, num: t.num, guesses: [], pats: [], done: false, won: false };
    return { mode:'daily', day:c.day, num:c.num, st:c };
  }
  let st = store.get('wx_pz', null);
  if (!st || st.day !== t.day) st = { day: t.day, guesses: [], done: false, won: false };
  st.pats = st.guesses.map(g => score(g, t.word));
  if (st.done) st.word = t.word;
  return { mode:'practice', day:t.day, num:t.num, word:t.word, st };
}

function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1600); }
async function pzKey(k){
  if (!PZ || pzBusy || PZ.st.done || PZ.st.legacy || !$('pz').classList.contains('open')) return;
  if (k === 'back'){ cur = cur.slice(0,-1); return drawPuzzle(); }
  if (k === 'enter'){
    if (cur.length < 5){ shakeRow(); return toast('Not enough letters'); }
    if (!window.PUZZLE_VALID.has(cur)){ shakeRow(); return toast('Not in word list'); }
    if (PZ.mode === 'daily'){
      pzBusy = true;
      const { data, error } = await sb.rpc('weather_guess', { p_guess: cur });
      pzBusy = false;
      if (error){ shakeRow(); return toast(/word list/i.test(error.message) ? 'Not in word list' : /already/i.test(error.message) ? 'Already played today' : 'Couldn’t reach the server — try again'); }
      const wasDone = PZ.st.done; PZ.st = fromServer(data); cur = '';
      store.set('wx_pz_srv', PZ.st, true);
      if (PZ.st.done && !wasDone){ finishStats(PZ.st.won, PZ.st.guesses.length); fetchRank(); }
      return drawPuzzle(PZ.st.guesses.length - 1);
    }
    const st = PZ.st; st.guesses.push(cur); st.pats.push(score(cur, PZ.word)); const row = st.guesses.length-1; cur = '';
    if (st.guesses[row] === PZ.word || st.guesses.length === 6){
      st.done = true; st.won = st.guesses[row] === PZ.word; st.word = PZ.word;
      finishStats(st.won, st.guesses.length);
    }
    store.set('wx_pz', { day: st.day, guesses: st.guesses, done: st.done, won: st.won }, true);
    return drawPuzzle(row);
  }
  if (/^[a-z]$/.test(k) && cur.length < 5){ cur += k; drawPuzzle(); }
}
function shakeRow(){ const r = $('pzr' + PZ.st.guesses.length); if (r){ r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); } }
$('kb').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pzKey(b.dataset.k); });
document.addEventListener('keydown', e => {
  if (!$('pz').classList.contains('open')) return;
  if (e.key === 'Enter') pzKey('enter'); else if (e.key === 'Backspace') pzKey('back');

// Long-press any card to start jiggle mode; in jiggle mode, press-and-hold briefly then drag to reorder.
(() => {
  const C = $('content');
  let lp = null, lpXY = null, eatClick = false, drag = null;
  const cardAt = el => el && el.closest('#content > section.card, #content > section.grid');
  C.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (!editLayout){
      if (!cardAt(e.target) || e.target.closest('input,button.ck,.hourly')) return;
      lpXY = { x: t.clientX, y: t.clientY };
      lp = setTimeout(() => { lp = null; eatClick = true; toggleLayoutEdit(true); }, 500);
      return;
    }
    const mv = e.target.closest('.mv'); if (!mv) return;
    drag = { el: mv, y0: t.clientY, armed: false };
    drag.timer = setTimeout(() => { if (drag){ drag.armed = true; drag.base = drag.y0; mv.classList.add('dragging'); } }, 160);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (lp && Math.hypot(t.clientX - lpXY.x, t.clientY - lpXY.y) > 10){ clearTimeout(lp); lp = null; }
    if (!drag) return;
    if (!drag.armed){ if (Math.abs(t.clientY - drag.y0) > 8){ clearTimeout(drag.timer); drag = null; } return; }   // it's a scroll
    e.preventDefault();
    // auto-scroll near the edges
    const edge = 90; let sc = 0;
    if (t.clientY < edge) sc = -10; else if (t.clientY > innerHeight - edge) sc = 10;
    if (sc){ const y0 = scrollY; scrollBy(0, sc); drag.base -= (scrollY - y0); }
    const el = drag.el, off = () => t.clientY - drag.base;
    el.style.transform = `translateY(${off()}px) scale(1.03)`;
    const r = el.getBoundingClientRect(), mid = r.top + r.height / 2;
    const prev = el.previousElementSibling, next = el.nextElementSibling;
    const swap = (fn) => { const before = el.getBoundingClientRect().top - off(); fn(); el.style.transform = 'none'; const after = el.getBoundingClientRect().top; drag.base += after - before; el.style.transform = `translateY(${off()}px) scale(1.03)`; };
    if (next && next.classList.contains('mv')){ const n = next.getBoundingClientRect(); if (mid > n.top + n.height / 2) swap(() => el.parentNode.insertBefore(next, el)); }
    if (prev && prev.classList.contains('mv')){ const p = prev.getBoundingClientRect(); if (mid < p.top + p.height / 2) swap(() => el.parentNode.insertBefore(el, prev)); }
  }, { passive: false });
  const end = () => {
    if (lp){ clearTimeout(lp); lp = null; }
    if (!drag) return;
    clearTimeout(drag.timer);
    if (drag.armed){ drag.el.classList.remove('dragging'); drag.el.style.transform = ''; saveDomOrder(); }
    drag = null;
  };
  document.addEventListener('touchend', end); document.addEventListener('touchcancel', end);
  document.addEventListener('click', e => { if (eatClick){ e.stopPropagation(); e.preventDefault(); eatClick = false; } }, true);
  C.addEventListener('contextmenu', e => { if (cardAt(e.target) || editLayout) e.preventDefault(); });
})();

/* ---------- daily to-do list ---------- */
// Items live in wx_todo (synced with the account). At the start of each new day, ticked items are archived under
// the day they were ticked; unticked ones roll over into today.
const TODO_KEEP_DAYS = 60;
let todoHist = false;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function todoGet(){ return store.get('wx_todo', { items: [], archive: {}, day: localDay() }); }
function todoSave(t){ store.set('wx_todo', t); }
function todoRoll(){
  const t = todoGet(), today = localDay();
  if (t.day === today) return t;
  t.archive = t.archive || {};
  const keep = [];
  for (const it of t.items){
    if (it.deleted){ if (today - (it.u_day || today) < 30) keep.push(it); continue; }   // keep tombstones a while for sync
    if (it.done){ const k = String(it.doneDay ?? t.day); (t.archive[k] = t.archive[k] || []).push(it.text); continue; }
    keep.push(it);                                            // not done: carries over
  }
  t.items = keep; t.day = today;
  Object.keys(t.archive).forEach(k => { if (today - +k > TODO_KEEP_DAYS) delete t.archive[k]; });
  todoSave(t);
  return t;
}
function mergeTodo(r, l){
  if (!r) return l; if (!l) return r;
  const byId = {};
  [...(r.items||[]), ...(l.items||[])].forEach(it => { const o = byId[it.id]; if (!o || (it.u||0) > (o.u||0)) byId[it.id] = it; });
  const archive = { ...(r.archive||{}) };
  Object.entries(l.archive||{}).forEach(([k, v]) => { if (!archive[k] || v.length > archive[k].length) archive[k] = v; });
  return { items: Object.values(byId).sort((a,b) => (a.c||0) - (b.c||0)), archive, day: Math.min(r.day ?? l.day, l.day ?? r.day) };
}
const dayLabel = n => { const d = new Date(2000, 0, 1 + n); return d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }); };
function todoCard(){
  const t = todoRoll(), items = t.items.filter(i => !i.deleted), done = items.filter(i => i.done).length;
  const next = items.find(i => !i.done);

  const pct = items.length ? done / items.length : 0, C = 2 * Math.PI * 19;
  const ring = `<svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="5"/>
    <circle cx="23" cy="23" r="19" fill="none" stroke="#2EE6A8" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 23 23)"/>
    <text x="23" y="27.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Outfit,sans-serif">${items.length ? done + '/' + items.length : '+'}</text></svg>`;

  const t2 = !items.length ? 'Add what you want to get done today' : next ? `Next: ${esc(next.text)}${carried ? ` · ${carried} from before` : ''}` : 'Nice work today';
  return `<section class="card todo-card" onclick="openTodo()">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> To-do today</h2>

}
function drawTodo(){

function remSuggestions(d){

  const ri = h.time.findIndex((t, i) => t.slice(0,10) === today && at(t) - now > 60 * 60 * 1000 && h.precipitation_probability[i] >= 60);
  if (ri >= 0){ const due = new Date(at(h.time[ri]) - 45 * 60 * 1000);
    if (soon(due)) out.push({ key:'rain', icon:'☔', t:`Rain likely from ${hm(at(h.time[ri]))}`, s:'Bring the washing in / grab a jacket', due, title:`☔ Rain from ${hm(at(h.time[ri]))}`, body:`${h.precipitation_probability[ri]}% chance in ${current.name}. Bring the washing in.` }); }
  // cold tonight

    if (soon(due)) out.push({ key:'uv', icon:'🧴', t:`UV ${Math.round(dy.uv_index_max[0])} around midday`, s:'Sunscreen reminder at 11:30am', due, title:'🧴 Sunscreen time', body:`UV hits ${Math.round(dy.uv_index_max[0])} today. Slip, slop, slap.` }); }

/* ---------- what to wear ---------- */
function wearTips(d, start){
  const c = d.current, h = d.hourly, dy = d.daily;
  const f = c.apparent_temperature, tips = [];
  const next3 = h.precipitation_probability.slice(start, start+3);
  const wet = ['rain','storm'].includes(kind(c.weather_code)) || (c.precipitation||0) > 0 || Math.max(0, ...next3) >= 50;
  if (wet){
    // one sensible tip for wet weather instead of "T-shirt" next to "Umbrella"
    tips.push(f <= 11 ? '🧥 Cold and wet — warm waterproof jacket'
            : f <= 18 ? '🧥 Rain jacket over a warm layer'
            : '☔ Warm but wet — rain jacket or umbrella');
  } else {
    tips.push(f <= 5 ? '🧣 Beanie + heavy jacket' : f <= 11 ? '🧥 Proper jacket' : f <= 16 ? '🧥 Hoodie or light jacket'
            : f <= 21 ? '👕 Long sleeves' : f <= 27 ? '👕 T-shirt weather' : '🩳 Shorts + singlet');
  }
  if (c.wind_gusts_10m >= 45 || c.wind_speed_10m >= 30) tips.push('💨 Windproof layer');
  if (c.is_day && (dy.uv_index_max[0] ?? 0) >= 6 && !wet && kind(c.weather_code) !== 'cloudy' && kind(c.weather_code) !== 'fog') tips.push('🕶️ Sunnies + SPF');
  return tips;
}

/* ---------- rain in the next 2 hours ---------- */
function nowcastCard(d){
  const m = d.minutely_15; if (!m || !m.time) return '';
  let i0 = m.time.findIndex(t => t >= d.current.time.slice(0,16)); if (i0 < 0) i0 = 0;
  const T = m.time.slice(i0, i0+8), P = m.precipitation.slice(i0, i0+8).map(v => v || 0);
  if (P.length < 4) return '';
  const WET = 0.1, wet = P.map(v => v >= WET), any = wet.some(Boolean);
  let msg;
  if (!any) msg = 'No rain for the next 2 hours';
  else if (wet[0]){
    const stop = wet.indexOf(false);
    msg = stop < 0 ? 'Rain for the next 2 hours' : `Rain easing in about ${stop*15} min`;
  } else msg = `Rain starting in about ${wet.indexOf(true)*15} min`;
  if (!any) return `<section class="card nowcast"><h2>${svgDrop()} Next 2 hours</h2><div class="msg" style="margin:0">${msg}</div></section>`;

  // intensity per 15 min: light < 0.5 mm, moderate < 2 mm, heavy >= 2 mm
  const lvl = v => v < WET ? '' : v < 0.5 ? 'l' : v < 2 ? 'm' : 'h';
  const total = P.reduce((a,v)=>a+v,0), peak = Math.max(...P);
  const scale = Math.max(0.5, Math.ceil(peak*4)/4);                // chart top: fits drizzle, at least 0.5 mm
  const fmt = v => v >= 10 ? v.toFixed(0) : v.toFixed(1);
  const cols = P.map(v => `<div class="rcol">${v >= WET ? `<em>${fmt(v)}</em>` : ''}<i class="${lvl(v)}" style="height:${v >= WET ? Math.max(6, v/scale*82) : 3}%"></i></div>`).join('');
  const times = T.map((t,i) => `<span>${i===0 ? 'Now' : fmtClock(t)}</span>`).join('');
  const peakName = peak < 0.5 ? 'Light' : peak < 2 ? 'Moderate' : 'Heavy';
  return `<section class="card nowcast">
    <h2>${svgDrop()} Next 2 hours</h2>
    <div class="msg">${msg}</div>
    <div class="rain-sum">
      <div>Total<b>${fmt(total)}<small>mm</small></b></div>
      <div>Heaviest<b>${fmt(peak)}<small>mm / 15 min</small></b></div>
      <div>Intensity<b>${peakName}</b></div>
    </div>
    <div class="rchart">${cols}</div>
    <div class="rtimes">${times}</div>
    <div class="rkey"><span style="--k:#8FDCFB">Light</span><span style="--k:#3F95EC">Moderate</span><span style="--k:#4A3FD8">Heavy</span><span style="opacity:.8">mm per 15 min</span></div>
  </section>`;
}
const fmtClock = iso => { const h = +iso.slice(11,13), m = iso.slice(14,16); return `${(h%12)||12}:${m}`; };
function svgDrop(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>`; }

/* ---------- moon phase ---------- */
function moonPhase(when = Date.now()){
  const SYN = 29.530588853, ref = Date.UTC(2000,0,6,18,14);
  const f = window.SunCalc ? SunCalc.getMoonIllumination(new Date(when)).phase : (((when - ref)/864e5) / SYN % 1 + 1) % 1;   // 0 new, .5 full
  const illum = Math.round((1 - Math.cos(2*Math.PI*f)) / 2 * 100);
  const names = ['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
  return { f, illum, name: names[Math.round(f*8) % 8] };
}
function moonPath(f){
  const waxing = f < .5, rx = Math.abs(Math.cos(2*Math.PI*f)).toFixed(3);
  const s1 = waxing ? 1 : 0, s2 = waxing ? (f < .25 ? 0 : 1) : (f < .75 ? 0 : 1);
  return `M0 -1 A1 1 0 0 ${s1} 0 1 A${rx} 1 0 0 ${s2} 0 -1Z`;
}
function moonSVG(f, lat, dark = 1){
  // southern hemisphere sees the moon flipped (waxing lit on the left)
  const flip = lat < 0 ? 'scale(-1 1)' : '';
  return `<svg viewBox="-1.1 -1.1 2.2 2.2" width="100%" height="100%">
    <defs><radialGradient id="mg" cx="-.3" cy="-.3" r="1.4" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFCEB"/><stop offset="1" stop-color="#E9D79A"/></radialGradient></defs>
    <circle r="1" fill="rgba(20,24,60,${(.55*dark).toFixed(2)})"/>
    <g transform="${flip}"><path d="${moonPath(f)}" fill="url(#mg)"/></g>
    <circle cx=".28" cy="-.2" r=".14" fill="rgba(160,140,90,.25)"/><circle cx="-.3" cy=".32" r=".1" fill="rgba(160,140,90,.2)"/>
  </svg>`;
}

function mergeData(remote, local){
  const out = {};
  // places: union, remote order first
  const r = remote.wx_saved || [], l = local.wx_saved || [];
  out.wx_saved = [...r, ...l.filter(p => !r.some(q => same(p,q)))];
  out.wx_last  = remote.wx_last ?? local.wx_last;
  out.wx_neon  = remote.wx_neon ?? local.wx_neon;
  out.wx_order = local.wx_order ?? remote.wx_order;
  // today's puzzle: keep the further-along game for the same day, else the newer day
  const rp = remote.wx_pz, lp = local.wx_pz;
  if (rp && lp){
    if (sameDay(rp, lp)) out.wx_pz = (lp.done && !rp.done) || lp.guesses.length > rp.guesses.length ? lp : rp;
    else out.wx_pz = rp.day > lp.day ? rp : lp;
  } else out.wx_pz = rp || lp;
  // stats: keep whichever has played more (ties: better streak)
  const rs = remote.wx_pz_stats, ls = local.wx_pz_stats;
  out.wx_pz_stats = !rs ? ls : !ls ? rs : (ls.played > rs.played || (ls.played === rs.played && ls.streak > rs.streak)) ? ls : rs;
  out.wx_todo = mergeTodo(remote.wx_todo, local.wx_todo);
  Object.keys(out).forEach(k => out[k] === undefined && delete out[k]);
  return out;
}

      if (forgot){
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: back });
        if (error) throw error; acctMsg = 'Check your email for the reset link.';
      } else if (up){
        const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: back } });
        if (error) throw error;
        if (data.session){ setUser(data.user); await pull(); acctMsg = 'Account created — you’re synced.'; }
        else { acctMode = 'in'; acctMsg = 'Nearly done — tap the link in the email we just sent, then sign in here.'; }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
        if (error) throw error;
        setUser(data.user); await pull(); acctMsg = 'Signed in and synced.';
      }
    } catch(err){
      const m = (err && err.message) || 'Something went wrong';
      acctErr = /invalid login/i.test(m) ? 'Email or password is incorrect.' : /not confirmed/i.test(m) ? 'Please confirm your email first — check your inbox.' : m;
    }
    drawAcct();
  };
}
function openAcct(){ acctErr = ''; drawAcct(); $('acct').classList.add('open'); }
function closeAcct(){ $('acct').classList.remove('open'); acctMsg = acctErr = ''; }
$('acctBtn').onclick = openAcct;
$('acct').onclick = e => { if (e.target === $('acct')) closeAcct(); };

if (sb){
  sb.auth.getSession().then(({ data }) => { setUser(data.session && data.session.user); if (user) pull().catch(()=>{}); });
  sb.auth.onAuthStateChange((ev, session) => {
    setUser(session && session.user);
    if (ev === 'PASSWORD_RECOVERY'){ acctMode = 'reset'; openAcct(); }
  });
  // pick up changes made on another phone when the app comes back to the front
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && user) pull().catch(()=>{}); });
}

/* ---------- go ---------- */
document.body.classList.toggle('neon', neon);
load(current);
if (useLoc) locateAndLoad(true);

// Auto refresh: every 10 min while open, and whenever the app comes back to the foreground
const STALE = 5*60*1000;
const refreshIfStale = () => { if (document.visibilityState==='visible' && Date.now()-lastFetch > STALE){ if (useLoc && current.here) locateAndLoad(true); else load(current, true); } };
setInterval(() => { if (document.visibilityState==='visible') load(current, true); }, 10*60*1000);
document.addEventListener('visibilitychange', refreshIfStale);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && user) loadReminders(); });
window.addEventListener('pageshow', refreshIfStale);
window.addEventListener('focus', refreshIfStale);

// Pull down to refresh (home-screen apps have no browser pull-to-refresh)
(() => {
  const ptr = $('ptr'), TH = 80;
  let y0 = null, dy = 0;
  addEventListener('touchstart', e => {
    if (scrollY <= 0 && !editLayout && !sheet.classList.contains('open') && !$('pz').classList.contains('open') && !$('acct').classList.contains('open') && !$('todoPage').classList.contains('open')) { y0 = e.touches[0].clientY; dy = 0; ptr.style.transition = 'none'; }
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 0 && scrollY <= 0) {
      const pull = Math.min(dy * .5, 110);
      ptr.style.opacity = Math.min(1, pull/50);
      ptr.style.transform = `translateY(${pull - 60}px) rotate(${pull*3}deg)`;
      ptr.classList.toggle('ready', dy*.5 >= TH*.5 + 20);
    }
  }, {passive:true});
  addEventListener('touchend', async () => {
    if (y0 === null) return;
    const go = dy*.5 >= TH*.5 + 20; y0 = null;
    ptr.style.transition = 'transform .25s, opacity .25s';
    if (go) {
      ptr.style.transform = 'translateY(30px)'; ptr.classList.add('spinning');
      await load(current, true);
      ptr.classList.remove('spinning');
    }
    ptr.style.transform = 'translateY(-70px)'; ptr.style.opacity = 0; ptr.classList.remove('ready');
  });
})();

// App updates: when a new version is deployed, swap to it automatically
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || !hadController) return; reloaded = true; location.reload();
  });
  var hadController = !!navigator.serviceWorker.controller;
}
</script>
