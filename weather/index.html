<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF8A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Weather</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --g1:#FFD166; --g2:#FF8A5B; --g3:#FF5E7E;
    --glass:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.28);
    --text:#fff;
    --soft:rgba(255,255,255,.78);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Outfit',system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:var(--g3);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background .6s ease;
    overflow-x:hidden;
  }
  .bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 100%)}

  /* sky scene: sun/moon arc from left horizon to right horizon */
  .scene{position:absolute;top:0;left:0;right:0;height:360px;overflow:hidden;z-index:0;pointer-events:none}
  .horizon-glow{position:absolute;left:-10%;right:-10%;bottom:-60px;height:140px;border-radius:50%;filter:blur(30px);opacity:0;transition:opacity 3s,background 3s}
  .sun{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;transition:left 3s linear,top 3s linear,opacity 3s,box-shadow 3s,background 3s}
  .moon{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#FFFBEA,#F2E3A8 70%);
    box-shadow:0 0 30px 8px rgba(255,244,200,.35),0 0 90px 30px rgba(255,244,200,.12);
    transition:left 3s linear,top 3s linear,opacity 3s}
  .moon::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(200,185,130,.35);top:14px;left:26px;box-shadow:-12px 14px 0 -2px rgba(200,185,130,.3)}
  .stars{position:absolute;inset:0;transition:opacity 3s;opacity:0}
  .sun,.moon{opacity:0}
  .stars i{position:absolute;border-radius:50%;background:#fff;animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.35}}
  .cloud{position:absolute;height:34px;border-radius:999px;filter:blur(1.5px);transition:opacity 3s,background 3s;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:'';position:absolute;border-radius:50%;background:inherit}
  .cloud::before{width:48%;height:180%;left:16%;bottom:20%}
  .cloud::after{width:36%;height:140%;left:50%;bottom:25%}
  @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}
  .precip{position:absolute;inset:0;opacity:0;transition:opacity 3s}
  .precip.rain{background:repeating-linear-gradient(105deg,transparent 0 13px,rgba(255,255,255,.4) 13px 14px);background-size:40px 60px;animation:fall .45s linear infinite}
  .precip.snow{background-image:radial-gradient(circle,#fff 1.5px,transparent 2px),radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px);background-size:46px 46px,30px 30px;animation:snowfall 6s linear infinite}
  @keyframes fall{to{background-position:-16px 60px}}
  @keyframes snowfall{to{background-position:20px 184px,-10px 120px}}

  .app{
    position:relative;z-index:1;max-width:480px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 32px);
  }

  /* top bar */
  .top{display:flex;align-items:center;gap:10px}
  .place{flex:1;min-width:0}
  .place h1{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
  .place p{font-size:13px;color:var(--soft);margin-top:1px}
  .icon-btn{
    width:42px;height:42px;border-radius:14px;border:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0;
    transition:transform .15s,background .2s;
  }
  .icon-btn:active{transform:scale(.92)}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn.on svg{fill:#fff}

  .chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;padding:7px 14px;border-radius:999px;font:500 13px 'Outfit',sans-serif;
    border:1px solid var(--line);background:var(--glass);color:#fff;cursor:pointer;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .chip.active{background:#fff;color:#333}

  /* hero */
  .hero{text-align:center;padding:70px 0 44px;text-shadow:0 2px 20px rgba(0,0,0,.22)}
  .temp{font-size:104px;font-weight:300;line-height:1;letter-spacing:-5px;margin-top:4px}
  .temp sup{font-size:44px;vertical-align:top;position:relative;top:12px;letter-spacing:0;margin-left:4px}
  .cond{font-size:21px;font-weight:500;margin-top:6px}
  .hilo{font-size:15px;color:var(--soft);margin-top:4px}

  /* cards */
  .card{
    background:var(--glass);border:1px solid var(--line);border-radius:26px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    padding:16px;margin-top:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
  }
  .card h2{font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--soft);margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .card h2 svg{width:14px;height:14px}

  .hourly{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;scroll-snap-type:x proximity}
  .hourly::-webkit-scrollbar{display:none}
  .hour{flex-shrink:0;width:58px;text-align:center;padding:10px 0;border-radius:18px;scroll-snap-align:start}
  .hour.now{background:rgba(255,255,255,.22)}
  .hour .t{font-size:13px;color:var(--soft);font-weight:500}
  .hour .i{width:34px;height:34px;margin:8px auto 4px}
  .hour .p{font-size:11px;color:#CFF1FF;font-weight:600;height:14px}
  .hour .v{font-size:17px;font-weight:600;margin-top:2px}

  .day{display:grid;grid-template-columns:54px 34px 38px 1fr 34px;align-items:center;gap:8px;padding:9px 0}
  .day + .day{border-top:1px solid rgba(255,255,255,.14)}
  .day .n{font-weight:500;font-size:16px}
  .day .i{width:30px;height:30px}
  .day .p{font-size:12px;color:#CFF1FF;font-weight:600;text-align:center}
  .day .lo{color:var(--soft);text-align:right;font-size:16px}
  .day .hi{font-weight:600;font-size:16px;text-align:right}
  .range{position:relative;height:6px;border-radius:6px;background:rgba(0,0,0,.12);margin:0 4px}
  .range span{position:absolute;top:0;bottom:0;border-radius:6px}
  .range .dot{width:10px;height:10px;top:-2px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.15)}
  .day-row{display:contents}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .grid .card{margin:0;padding:14px 16px}
  .stat .v{font-size:30px;font-weight:500;letter-spacing:-.5px;line-height:1.1}
  .stat .v small{font-size:16px;font-weight:400;margin-left:2px}
  .stat .s{font-size:13px;color:var(--soft);margin-top:6px;line-height:1.35}
  .meter{height:6px;border-radius:6px;margin-top:10px;background:linear-gradient(90deg,#5BE37D,#FFE14D,#FF9F43,#FF5E5E,#B266FF);position:relative}
  .meter i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.2);transform:translateX(-50%)}
  .compass{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.35);position:relative;margin-top:2px;float:right;margin-left:6px}
  .compass b{position:absolute;inset:0;display:grid;place-items:center;transition:transform .6s}
  .compass b svg{width:22px;height:22px}
  .compass em{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;font-style:normal;font-weight:700;color:var(--soft)}

  .foot{text-align:center;font-size:12px;color:var(--soft);margin-top:22px}

  /* ===== Neon Coast mode ===== */
  .neon-only{display:none}
  body.neon .neon-only{display:block}
  body.neon{--glass:rgba(24,6,48,.34);--line:rgba(255,70,190,.5);--soft:rgba(255,226,250,.82)}
  body.neon .card{box-shadow:inset 0 0 0 1px rgba(0,240,255,.12),0 0 22px rgba(255,46,154,.28)}
  body.neon .card h2{color:#62F7FF;text-shadow:0 0 8px rgba(0,240,255,.7)}
  body.neon .hero{text-shadow:none;padding-bottom:86px}
  body.neon .temp{font-weight:700;font-style:italic;letter-spacing:-3px;
    background:linear-gradient(180deg,#FFF59A 0%,#FFB347 40%,#FF4FA3 75%,#C84BFF 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,46,154,.75)) drop-shadow(0 0 1px rgba(255,255,255,.9))}
  body.neon .cond{text-transform:uppercase;letter-spacing:5px;font-weight:600;color:#fff;text-shadow:0 0 4px #FF2E9A,0 0 14px #FF2E9A,0 0 30px rgba(255,46,154,.6)}
  body.neon .hilo{color:#fff;text-shadow:0 1px 8px rgba(40,0,70,.65),0 0 14px rgba(255,46,154,.5)}
  body.neon .place h1{text-shadow:0 0 10px rgba(255,46,154,.8)}
  body.neon .icon-btn,body.neon .chip,body.neon .refresh{box-shadow:0 0 12px rgba(255,46,154,.35)}
  body.neon .hour.now{background:rgba(255,46,154,.28)}
  .chip.mode{display:inline-flex;align-items:center;gap:6px}
  .chip.mode.on{background:linear-gradient(90deg,#FF2E9A,#FF9A3D);color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(255,46,154,.7)}
  .skyline{position:absolute;left:0;right:0;bottom:-1px;height:64px}
  .skyline svg{width:100%;height:100%;display:block}
  .palm{position:absolute;bottom:-6px;width:112px;height:154px}
  .palm.l{left:-26px}
  .palm.r{right:-26px;transform:scaleX(-1)}
  .floor{position:fixed;left:-20%;right:-20%;bottom:0;height:38vh;z-index:0;pointer-events:none;perspective:260px;
    -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 95%);mask-image:linear-gradient(to top,#000 10%,transparent 95%)}
  .floor div{position:absolute;inset:0;transform:rotateX(62deg);transform-origin:50% 100%;opacity:.45;
    background-image:linear-gradient(rgba(255,60,200,.9) 2px,transparent 2px),linear-gradient(90deg,rgba(0,240,255,.7) 2px,transparent 2px);
    background-size:60px 60px;animation:floor 2.4s linear infinite}
  @keyframes floor{to{background-position:0 60px}}
  .refresh{display:inline-flex;align-items:center;gap:8px;margin:18px auto 0;padding:10px 18px;border-radius:999px;
    border:1px solid var(--line);background:var(--glass);color:#fff;font:500 14px 'Outfit',sans-serif;cursor:pointer;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .refresh svg{width:16px;height:16px}
  .refresh-wrap{text-align:center}
  .spinning svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  html,body{overscroll-behavior-y:contain}
  .ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:20;width:40px;height:40px;margin-left:-20px;border-radius:50%;
    background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18);
    transform:translateY(-70px);opacity:0;pointer-events:none}
  .ptr svg{width:20px;height:20px;color:#555}
  .ptr.ready svg{color:#FF6A3D}
  .foot a{color:#fff}

  /* search sheet */
  .sheet{position:fixed;inset:0;z-index:10;background:rgba(20,10,40,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet.open{opacity:1;pointer-events:auto}
  .panel{
    max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;
    transform:translateY(-16px);transition:transform .25s;
  }
  .sheet.open .panel{transform:none}
  .search{display:flex;gap:10px}
  .search input{
    flex:1;height:48px;border-radius:16px;border:1px solid var(--line);
    background:rgba(255,255,255,.95);color:#222;font:500 16px 'Outfit',sans-serif;padding:0 16px;outline:none;
  }
  .results{margin-top:12px;background:rgba(255,255,255,.96);border-radius:20px;overflow:hidden;color:#222}
  .results:empty{display:none}
  .res{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px}
  .res + .res{border-top:1px solid #eee}
  .res:hover{background:#f6f3ff}
  .res b{font-weight:600}
  .res small{display:block;color:#777;font-size:13px}
  .res svg{width:18px;height:18px;flex-shrink:0;color:#8a6cff}

  .loading .hero,.loading .card{opacity:.55}
  .err{text-align:center;padding:60px 20px;font-size:16px}
  .err button{margin-top:16px}
  .btn{padding:12px 20px;border-radius:14px;border:0;background:#fff;color:#333;font:600 15px 'Outfit',sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="scene" id="scene">
  <div class="stars" id="stars"></div>
  <div class="horizon-glow" id="hglow"></div>
  <div class="moon" id="moon"></div>
  <div class="sun" id="sun"></div>
  <div id="clouds"></div>
  <div class="skyline neon-only" id="skyline"></div>
  <svg class="palm l neon-only" viewBox="0 0 150 200"><use href="#palmShape"/></svg>
  <svg class="palm r neon-only" viewBox="0 0 150 200"><use href="#palmShape"/></svg>
  <div class="precip" id="precip"></div>
</div>
<div class="floor neon-only"><div></div></div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="palmShape" fill="#1A0930" stroke="rgba(255,60,180,.55)" stroke-width="1.2">
      <path d="M60 204 C64 150 67 108 75 62" stroke="#1A0930" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M60 204 C64 150 67 108 75 62" stroke="rgba(255,60,180,.45)" stroke-width="1" fill="none" transform="translate(4 0)"/>
      <path d="M74 62 C50 40 22 44 6 74 C28 56 50 54 74 65Z"/>
      <path d="M74 62 C58 30 34 18 16 24 C40 30 56 42 72 63Z"/>
      <path d="M74 62 C80 28 100 12 124 16 C102 26 86 40 76 63Z"/>
      <path d="M74 62 C100 42 128 46 146 76 C122 58 100 56 76 65Z"/>
      <path d="M74 62 C60 70 46 92 44 116 C52 94 62 80 75 66Z"/>
      <path d="M74 62 C92 70 104 94 104 118 C98 96 88 82 74 67Z"/>
    </g>
  </defs>
</svg>

<div class="ptr" id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></div>
<main class="app loading" id="app">
  <header class="top">
    <div class="place">
      <h1 id="placeName">Loading…</h1>
      <p id="placeSub">&nbsp;</p>
    </div>
    <button class="icon-btn" id="saveBtn" aria-label="Save place">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
    </button>
    <button class="icon-btn" id="locBtn" aria-label="Use my location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="icon-btn" id="searchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </header>
  <nav class="chips" id="chips"></nav>
  <div id="content"></div>
</main>

<div class="sheet" id="sheet">
  <div class="panel">
    <form class="search" id="searchForm">
      <input id="q" type="search" placeholder="Search a town or city" autocomplete="off" enterkeyhint="search">
      <button type="button" class="icon-btn" id="closeSearch" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
    <div class="results" id="results"></div>
  </div>
</div>

<script>
const DEFAULT_PLACE = { name:'Maryborough', sub:'Victoria, Australia', lat:-37.0457, lon:143.7393 };

/* ---------- storage (safe) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let saved = store.get('wx_saved', [DEFAULT_PLACE]);
let current = store.get('wx_last', DEFAULT_PLACE);

/* ---------- weather codes ---------- */
function kind(code){
  if (code === 0) return 'clear';
  if (code === 1 || code === 2) return 'partly';
  if (code === 3) return 'cloudy';
  if (code === 45 || code === 48) return 'fog';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if (code >= 95) return 'storm';
  return 'cloudy';
}
const LABELS = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Icy fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',
  85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Storm with hail',99:'Storm with hail'};


/* ---------- icons ---------- */
const SUN = (cx=32,cy=32,r=11)=>{
  let rays='';
  for(let a=0;a<360;a+=45){const t=a*Math.PI/180;
    rays+=`<line x1="${cx+Math.cos(t)*(r+5)}" y1="${cy+Math.sin(t)*(r+5)}" x2="${cx+Math.cos(t)*(r+10)}" y2="${cy+Math.sin(t)*(r+10)}"/>`;}
  return `<g stroke="#FFD43B" stroke-width="4" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#sunG)"/>`;
};
const MOON = `<path d="M40 10a20 20 0 1 0 14 34A17 17 0 0 1 40 10z" fill="url(#moonG)"/>`;
const CLOUD = (fill='#fff', ty=0) => `<path transform="translate(0 ${ty})" d="M18 50h29a11 11 0 0 0 1.5-21.9A15 15 0 0 0 20.2 26 12 12 0 0 0 18 50z" fill="${fill}"/>`;
const DEFS = `<defs>
  <linearGradient id="sunG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE66D"/><stop offset="1" stop-color="#FFB627"/></linearGradient>
  <linearGradient id="moonG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6C8"/><stop offset="1" stop-color="#F5D97A"/></linearGradient>
</defs>`;

function icon(code, isDay){
  const k = kind(code);
  let s = DEFS;
  if (k === 'clear') s += isDay ? SUN() : MOON;
  else if (k === 'partly') s += (isDay ? `<g transform="translate(-6 -8) scale(.85)">${SUN()}</g>` : `<g transform="translate(-8 -8) scale(.75)">${MOON}</g>`) + CLOUD('#fff', 6);
  else if (k === 'cloudy') s += `<g transform="translate(14 -8) scale(.8)">${CLOUD('#E3EBFF')}</g>` + CLOUD('#fff', 4);
  else if (k === 'fog') s += CLOUD('#fff', -6) + `<g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"><line x1="12" y1="52" x2="52" y2="52"/><line x1="18" y1="59" x2="46" y2="59"/></g>`;
  else if (k === 'rain') s += CLOUD('#fff', -8) + `<g stroke="#7FD8FF" stroke-width="4" stroke-linecap="round"><line x1="22" y1="48" x2="19" y2="56"/><line x1="33" y1="48" x2="30" y2="58"/><line x1="44" y1="48" x2="41" y2="56"/></g>`;
  else if (k === 'snow') s += CLOUD('#fff', -8) + `<g fill="#fff"><circle cx="21" cy="52" r="3"/><circle cx="32" cy="57" r="3"/><circle cx="43" cy="52" r="3"/></g>`;
  else if (k === 'storm') s += CLOUD('#E7E1FF', -8) + `<path d="M34 42l-9 13h7l-4 10 12-15h-7l5-8z" fill="#FFD43B"/>`;
  return `<svg viewBox="0 0 64 64" width="100%" height="100%">${s}</svg>`;
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const r0 = n => Math.round(n);
const compassDir = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
const fmtTime = iso => {
  const [h,m] = iso.slice(11,16).split(':').map(Number);
  return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'am':'pm'}`;
};
const fmtHour = iso => { const h = Number(iso.slice(11,13)); return `${(h%12)||12}${h<12?'am':'pm'}`; };
const dayName = (iso, i) => i===0 ? 'Today' : new Date(iso+'T12:00:00').toLocaleDateString('en-AU',{weekday:'short'});
function uvLabel(u){ return u<3?'Low':u<6?'Moderate':u<8?'High':u<11?'Very high':'Extreme'; }


/* ---------- data ---------- */
async function getWeather(p){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}`
   + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation`
   + `&hourly=temperature_2m,weather_code,precipitation_probability,is_day`
   + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max`
   + `&timezone=auto&forecast_days=7`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Weather unavailable');
  return res.json();
}

let lastFetch = 0, busy = false;
const REFRESH_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>`;
async function load(p, quiet=false){
  if (busy) return; busy = true;
  current = p; store.set('wx_last', p);
  if (!quiet) $('app').classList.add('loading');
  $('placeName').textContent = p.name;
  $('placeSub').textContent = p.sub || '';
  renderChips(); renderSave();
  try{
    const d = await getWeather(p);
    lastFetch = Date.now();
    render(d);
  }catch(e){
    if (!lastData || !quiet)
      $('content').innerHTML = `<div class="err">Couldn't load the weather.<br><button class="btn" onclick="load(current)">Try again</button></div>`;
  }
  $('app').classList.remove('loading');
  busy = false;
}
async function refreshNow(){
  const b = $('refreshBtn'); if (b) b.classList.add('spinning');
  await load(current, true);
}

/* ---------- render ---------- */
function render(d){
  const c = d.current, h = d.hourly, dy = d.daily;
  lastData = d;

  // hourly: from current hour, 24 entries
  const nowKey = c.time.slice(0,13);
  let start = h.time.findIndex(t => t.slice(0,13) >= nowKey); if(start<0) start=0;
  let hours = '';
  for(let i=start;i<Math.min(start+24,h.time.length);i++){
    const p = h.precipitation_probability[i];
    hours += `<div class="hour ${i===start?'now':''}">
      <div class="t">${i===start?'Now':fmtHour(h.time[i])}</div>
      <div class="i">${i===start?icon(c.weather_code,c.is_day):icon(h.weather_code[i], h.is_day[i])}</div>
      <div class="p">${p>=20?p+'%':''}</div>
      <div class="v">${r0(i===start?c.temperature_2m:h.temperature_2m[i])}°</div>
    </div>`;
  }

  // daily with range bars
  const wkMin = Math.min(...dy.temperature_2m_min), wkMax = Math.max(...dy.temperature_2m_max);
  const span = Math.max(1, wkMax - wkMin);
  let days = '';
  dy.time.forEach((t,i)=>{
    const lo = dy.temperature_2m_min[i], hi = dy.temperature_2m_max[i];
    const L = (lo-wkMin)/span*100, W = (hi-lo)/span*100;
    const p = dy.precipitation_probability_max[i];
    const dot = i===0 ? `<span class="dot" style="left:calc(${Math.min(100,Math.max(0,(c.temperature_2m-wkMin)/span*100))}% - 5px)"></span>` : '';
    days += `<div class="day">
      <div class="n">${dayName(t,i)}</div>
      <div class="i">${icon(dy.weather_code[i],1)}</div>
      <div class="p">${p>=20?p+'%':''}</div>
      <div style="display:grid;grid-template-columns:30px 1fr;align-items:center;gap:6px">
        <div class="lo">${r0(lo)}°</div>
        <div class="range"><span style="left:${L}%;width:${Math.max(W,4)}%;background:linear-gradient(90deg,${tempColor(lo)},${tempColor(hi)})"></span>${dot}</div>
      </div>
      <div class="hi">${r0(hi)}°</div>
    </div>`;
  });

  const uv = dy.uv_index_max[0] ?? 0;
  const arrow = `<svg viewBox="0 0 24 24"><path d="M12 2l5 14-5-3-5 3z" fill="#fff"/></svg>`;

  $('content').innerHTML = `
    <section class="hero" id="hero">
      <div class="temp">${r0(c.temperature_2m)}<sup>°</sup></div>
      <div class="cond">${LABELS[c.weather_code] || '—'}</div>
      <div class="hilo">H ${r0(dy.temperature_2m_max[0])}°  ·  L ${r0(dy.temperature_2m_min[0])}°  ·  Feels like ${r0(c.apparent_temperature)}°</div>
    </section>

    <section class="card">
      <h2>${svgClock()} Next 24 hours</h2>
      <div class="hourly">${hours}</div>
    </section>

    <section class="card">
      <h2>${svgCal()} 7-day forecast</h2>
      ${days}
    </section>

    <section class="grid">
      <div class="card stat">
        <h2>Wind</h2>
        <div class="compass"><em>N</em><b style="transform:rotate(${(c.wind_direction_10m+180)%360}deg)">${arrow}</b></div>
        <div class="v">${r0(c.wind_speed_10m)}<small>km/h</small></div>
        <div class="s">${compassDir(c.wind_direction_10m)} · gusts ${r0(c.wind_gusts_10m)}</div>
      </div>
      <div class="card stat">
        <h2>UV index</h2>
        <div class="v">${r0(uv)}</div>
        <div class="s">${uvLabel(uv)}</div>
        <div class="meter"><i style="left:${Math.min(100,uv/11*100)}%"></i></div>
      </div>
      <div class="card stat">
        <h2>Humidity</h2>
        <div class="v">${r0(c.relative_humidity_2m)}<small>%</small></div>
        <div class="s">${humidityNote(c.relative_humidity_2m)}</div>
      </div>
      <div class="card stat">
        <h2>Rain today</h2>
        <div class="v">${(dy.precipitation_sum[0]??0).toFixed(1)}<small>mm</small></div>
        <div class="s">${dy.precipitation_probability_max[0] ?? 0}% chance</div>
      </div>
      <div class="card stat">
        <h2>Sunrise</h2>
        <div class="v" style="font-size:24px">${fmtTime(dy.sunrise[0])}</div>
        <div class="s">Sunset ${fmtTime(dy.sunset[0])}</div>
      </div>
      <div class="card stat">
        <h2>Feels like</h2>
        <div class="v">${r0(c.apparent_temperature)}°</div>
        <div class="s">${feelsNote(c.apparent_temperature, c.temperature_2m)}</div>
      </div>
    </section>

    <div class="refresh-wrap"><button class="refresh" id="refreshBtn" onclick="refreshNow()">${REFRESH_SVG} Refresh</button></div>
    <p class="foot">Updated ${new Date(lastFetch).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})} · Data by <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></p>
  `;
  buildClouds(kind(c.weather_code));
  updateSky();
}

/* ---------- living sky ---------- */
let lastData = null;
// Sky colours (top, middle, horizon) keyed by day progress: 0 = sunrise, 1 = sunset.
const SKY = [
  [-0.16, ['#0A0F26','#151A40','#2A2763']],
  [-0.06, ['#1E2561','#56398A','#C95A7C']],
  [ 0.02, ['#4558A8','#EE877F','#FFC46C']],
  [ 0.14, ['#4C9FEE','#8ACAF4','#FFE1A4']],
  [ 0.50, ['#2D89EA','#56B2F4','#A4DCFF']],
  [ 0.86, ['#3986DE','#86BAEE','#FFD298']],
  [ 0.98, ['#3B3E92','#E05F7C','#FF995A']],
  [ 1.06, ['#1E2161','#5A2E7E','#B4446F']],
  [ 1.16, ['#0A0F26','#151A40','#2A2763']],
];
const NEON_SKY = [
  [-0.16, ['#0D0221','#26083F','#541066']],
  [-0.06, ['#1B0638','#6E1B72','#FF3E8A']],
  [ 0.02, ['#3A1C71','#D9567E','#FFAF6B']],
  [ 0.14, ['#1FC8D6','#86DDEB','#FFBC8F']],
  [ 0.50, ['#10CFF5','#7FE3FC','#FFC1E3']],
  [ 0.86, ['#2C9BFF','#B98BFF','#FF9C8C']],
  [ 0.98, ['#5B0E91','#FF2E9A','#FF9A3D']],
  [ 1.06, ['#2A0845','#921F80','#FF4F81']],
  [ 1.16, ['#0D0221','#26083F','#541066']],
];
let neon = store.get('wx_neon', false);
function applyMode(){
  document.body.classList.toggle('neon', neon);
  renderChips();
  updateSky();
}
function buildSkyline(){
  // original generic skyline: deterministic block towers with lit windows
  let x = 0, svg = '', win = '', i = 0;
  const W = 400, H = 64;
  while (x < W){
    const w = 14 + ((i*37)%22), h = 18 + ((i*53)%40), top = H - h;
    svg += `<rect x="${x}" y="${top}" width="${w}" height="${h}"/>`;
    if (i % 5 === 2) svg += `<rect x="${x+3}" y="${top-6}" width="${w-6}" height="6"/><rect x="${x+w/2-1}" y="${top-16}" width="2" height="10"/>`;
    for (let wy = top+5; wy < H-4; wy += 7) for (let wx = x+3; wx < x+w-3; wx += 5)
      if (((wx*7+wy*3+i)%5) < 2) win += `<rect x="${wx}" y="${wy}" width="2" height="3"/>`;
    x += w + 2; i++;
  }
  $('skyline').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice">
    <g fill="#1A0930" stroke="rgba(255,60,190,.55)" stroke-width=".6">${svg}</g>
    <g id="winLights" fill="#FFE27A">${win}</g></svg>`;
}
buildSkyline();
const CLOUDINESS = {clear:0, partly:.12, cloudy:.42, fog:.5, rain:.5, snow:.3, storm:.62};

const hex2rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex = a => '#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix = (a,b,t) => { const A=hex2rgb(a),B=hex2rgb(b); return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t)); };
const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
function mute(hex, amt){ // desaturate + dim for overcast skies
  const [r,g,b] = hex2rgb(hex), l = (.3*r+.59*g+.11*b)*.88;
  return rgb2hex([r,g,b].map(v=>v+(l-v)*amt));
}
function skyAt(p){
  const K = neon ? NEON_SKY : SKY;
  if (p <= K[0][0] || p >= K[K.length-1][0]) return K[0][1];
  for (let i=0;i<K.length-1;i++){
    const [p0,c0] = K[i], [p1,c1] = K[i+1];
    if (p >= p0 && p <= p1){ const t=(p-p0)/(p1-p0); return c0.map((c,j)=>mix(c,c1[j],t)); }
  }
}

function buildClouds(k){
  const n = {clear:0, partly:2, cloudy:4, fog:3, rain:4, snow:3, storm:4}[k] ?? 2;
  let html = '';
  for (let i=0;i<n;i++){
    const w = 110 + (i*47)%90, top = 40 + (i*67)%200, dur = 70 + i*23, delay = -(i*31 % dur);
    html += `<div class="cloud" style="width:${w}px;top:${top}px;animation-duration:${dur}s;animation-delay:${delay}s"></div>`;
  }
  $('clouds').innerHTML = html;
  const pr = $('precip');
  pr.className = 'precip' + (k==='rain'||k==='storm' ? ' rain' : k==='snow' ? ' snow' : '');
}

function buildStars(){
  let html='';
  for (let i=0;i<46;i++){
    const s = Math.random()<.2 ? 3 : 2;
    html += `<i style="left:${Math.random()*100}%;top:${Math.random()*92}%;width:${s}px;height:${s}px;animation-delay:${-Math.random()*4}s"></i>`;
  }
  $('stars').innerHTML = html;
}
buildStars();

const parseLocal = s => Date.parse(s + ':00Z'); // location-local wall time as a UTC timestamp
function updateSky(){
  const d = lastData; if (!d) return;
  const dy = d.daily;
  const now = Date.now() + (d.utc_offset_seconds||0)*1000;
  const today = new Date(now).toISOString().slice(0,10);
  let i = dy.time.indexOf(today); if (i < 0) i = 0;
  const rise = parseLocal(dy.sunrise[i]), set = parseLocal(dy.sunset[i]);
  const p = (now - rise) / (set - rise);

  // moon progress across the night
  let q = -1;
  if (now > set){ const next = dy.sunrise[i+1] ? parseLocal(dy.sunrise[i+1]) : rise + 864e5; q = (now - set)/(next - set); }
  else if (now < rise){ const prev = set - 864e5; q = (now - prev)/(rise - prev); }

  const k = kind(d.current.weather_code);
  const cloud = CLOUDINESS[k] ?? 0;
  const night = p < 0 ? clamp(-p/0.08) : p > 1 ? clamp((p-1)/0.08) : 0;
  const elev = clamp(Math.sin(Math.PI*p));

  // sky gradient
  const cols = skyAt(p).map(c => mute(c, neon ? cloud*.6 : cloud));
  const r = document.documentElement.style;
  r.setProperty('--g1', cols[0]); r.setProperty('--g2', cols[1]); r.setProperty('--g3', cols[2]);
  document.querySelector('meta[name=theme-color]').setAttribute('content', cols[0]);

  // arc geometry: horizon sits just under the temperature block
  const hero = document.getElementById('hero');
  const H = hero ? hero.getBoundingClientRect().bottom + window.scrollY : 360;
  const scene = $('scene'); scene.style.height = H + 'px';
  const W = scene.clientWidth;
  const place = (el, t) => {
    el.style.left = (W*(0.07 + t*0.86)) + 'px';
    el.style.top  = (H - Math.sin(Math.PI*t)*(H - 86)) + 'px';
  };

  // sun: deep orange at the horizon, pale gold overhead
  const sun = $('sun');
  if (p > -0.2 && p < 1.2){
    place(sun, p);
    const core = mix('#FF7A3D', '#FFF6CF', Math.pow(elev, .55));
    const glow = mix('#FF5E3A', '#FFE27A', elev);
    if (neon){
      sun.style.width = sun.style.height = '104px'; sun.style.margin = '-52px 0 0 -52px';
      sun.style.background = 'linear-gradient(180deg,#FFF59A 0%,#FFB347 38%,#FF4F8B 72%,#D63BFF 100%)';
      sun.style.webkitMaskImage = sun.style.maskImage = 'linear-gradient(180deg,#000 0 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 77%,transparent 77% 83%,#000 83% 90%,transparent 90% 97%,#000 97%)';
      sun.style.boxShadow = 'none';
      sun.style.filter = 'drop-shadow(0 0 22px rgba(255,79,139,.9)) drop-shadow(0 0 60px rgba(255,140,60,.5))';
    } else {
      sun.style.width = sun.style.height = ''; sun.style.margin = '';
      sun.style.webkitMaskImage = sun.style.maskImage = ''; sun.style.filter = '';
      sun.style.background = `radial-gradient(circle at 50% 50%, #FFFDF2 0%, ${core} 55%, ${glow} 100%)`;
      sun.style.boxShadow = `0 0 40px 12px ${glow}cc, 0 0 120px 50px ${glow}55, 0 0 240px 120px ${glow}22`;
    }
    sun.style.opacity = 1 - cloud*0.85;
  } else sun.style.opacity = 0;

  // horizon glow around sunrise/sunset
  const twilight = clamp(1 - Math.min(Math.abs(p), Math.abs(p-1)) / 0.12);
  const hg = $('hglow');
  hg.style.background = `radial-gradient(ellipse at ${p < .5 ? '15%' : '85%'} 50%, ${neon ? '#FF2E9A' : '#FF8A50'}, transparent 70%)`;
  hg.style.opacity = neon ? Math.max(.35, twilight) * (1 - cloud*.5) : twilight * (1 - cloud) * 0.85;
  const wl = document.getElementById('winLights'); if (wl) wl.style.opacity = .25 + night*.75;

  // moon + stars
  const moon = $('moon');
  if (q >= 0){ place(moon, q); moon.style.opacity = night * (1 - cloud*0.7); }
  else moon.style.opacity = 0;
  $('stars').style.opacity = night * (1 - cloud*1.4);

  // clouds tint with the sky
  const cloudCol = mix(mix('#FFFFFF', cols[1], .25), '#3A3F5C', night*.75);
  const darker = (k==='rain'||k==='storm') ? .35 : 0;
  document.querySelectorAll('.cloud').forEach(c => {
    c.style.background = mix(cloudCol, '#5A6178', darker);
    c.style.opacity = k==='clear' ? 0 : k==='partly' ? .75 : .92;
  });
  $('precip').style.opacity = (k==='rain'||k==='storm'||k==='snow') ? .55 : 0;
}
setInterval(updateSky, 30000);
window.addEventListener('resize', updateSky);

function tempColor(t){
  if(t<=0) return '#9AD8FF'; if(t<=8) return '#6EC6FF'; if(t<=14) return '#5BE3C0';
  if(t<=20) return '#B6F06A'; if(t<=26) return '#FFE14D'; if(t<=32) return '#FF9F43'; return '#FF5E5E';
}
function humidityNote(h){ return h<30?'Dry':h<60?'Comfortable':h<80?'Humid':'Very humid'; }
function feelsNote(f,t){ const d=f-t; return Math.abs(d)<1.5?'Same as actual':d<0?'Cooler than actual':'Warmer than actual'; }
function svgClock(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`; }
function svgCal(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`; }

/* ---------- saved places ---------- */
const same = (a,b) => Math.abs(a.lat-b.lat)<0.01 && Math.abs(a.lon-b.lon)<0.01;
function renderChips(){
  $('chips').innerHTML = `<button class="chip mode ${neon?'on':''}" id="modeBtn">🌴 Neon Coast</button>` + saved.map((p,i)=>`<button class="chip ${same(p,current)?'active':''}" data-i="${i}">${p.name}</button>`).join('');
}
function renderSave(){ $('saveBtn').classList.toggle('on', saved.some(p=>same(p,current))); }
$('chips').onclick = e => {
  const b = e.target.closest('.chip'); if(!b) return;
  if (b.id === 'modeBtn'){ neon = !neon; store.set('wx_neon', neon); applyMode(); return; }
  load(saved[+b.dataset.i]);
};
$('saveBtn').onclick = () => {
  const i = saved.findIndex(p=>same(p,current));
  if(i>=0) saved.splice(i,1); else saved.push({...current});
  store.set('wx_saved', saved); renderChips(); renderSave();
};

/* ---------- search ---------- */
const sheet = $('sheet');
$('searchBtn').onclick = () => { sheet.classList.add('open'); setTimeout(()=>$('q').focus(),50); };
$('closeSearch').onclick = closeSheet;
sheet.onclick = e => { if(e.target === sheet) closeSheet(); };
function closeSheet(){ sheet.classList.remove('open'); $('q').value=''; $('results').innerHTML=''; }

let timer, lastResults = [];
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(search, 250); };
$('searchForm').onsubmit = e => { e.preventDefault(); if(lastResults[0]) pick(0); else search(); };
async function search(){
  const q = $('q').value.trim();
  if(q.length < 2){ $('results').innerHTML=''; return; }
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=7&language=en&format=json`);
    const j = await r.json();
    lastResults = (j.results||[]).map(x=>({ name:x.name, sub:[x.admin1,x.country].filter(Boolean).join(', '), lat:x.latitude, lon:x.longitude }));
    const pin = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;
    $('results').innerHTML = lastResults.length
      ? lastResults.map((p,i)=>`<div class="res" data-i="${i}">${pin}<div><b>${p.name}</b><small>${p.sub}</small></div></div>`).join('')
      : `<div class="res"><div><small>No places found</small></div></div>`;
  }catch{ $('results').innerHTML = `<div class="res"><div><small>Search unavailable</small></div></div>`; }
}
$('results').onclick = e => { const r = e.target.closest('.res[data-i]'); if(r) pick(+r.dataset.i); };
function pick(i){ closeSheet(); load(lastResults[i]); }

/* ---------- go ---------- */
document.body.classList.toggle('neon', neon);
load(current);

// Auto refresh: every 10 min while open, and whenever the app comes back to the foreground
const STALE = 5*60*1000;
const refreshIfStale = () => { if (document.visibilityState==='visible' && Date.now()-lastFetch > STALE) load(current, true); };
setInterval(() => { if (document.visibilityState==='visible') load(current, true); }, 10*60*1000);
document.addEventListener('visibilitychange', refreshIfStale);
window.addEventListener('pageshow', refreshIfStale);
window.addEventListener('focus', refreshIfStale);

// Pull down to refresh (home-screen apps have no browser pull-to-refresh)
(() => {
  const ptr = $('ptr'), TH = 80;
  let y0 = null, dy = 0;
  addEventListener('touchstart', e => {
    if (scrollY <= 0 && !sheet.classList.contains('open')) { y0 = e.touches[0].clientY; dy = 0; ptr.style.transition = 'none'; }
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 0 && scrollY <= 0) {
      const pull = Math.min(dy * .5, 110);
      ptr.style.opacity = Math.min(1, pull/50);
      ptr.style.transform = `translateY(${pull - 60}px) rotate(${pull*3}deg)`;
      ptr.classList.toggle('ready', dy*.5 >= TH*.5 + 20);
    }
  }, {passive:true});
  addEventListener('touchend', async () => {
    if (y0 === null) return;
    const go = dy*.5 >= TH*.5 + 20; y0 = null;
    ptr.style.transition = 'transform .25s, opacity .25s';
    if (go) {
      ptr.style.transform = 'translateY(30px)'; ptr.classList.add('spinning');
      await load(current, true);
      ptr.classList.remove('spinning');
    }
    ptr.style.transform = 'translateY(-70px)'; ptr.style.opacity = 0; ptr.classList.remove('ready');
  });
})();

// App updates: when a new version is deployed, swap to it automatically
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || !hadController) return; reloaded = true; location.reload();
  });
  var hadController = !!navigator.serviceWorker.controller;
}
</script>
