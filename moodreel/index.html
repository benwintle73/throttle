<style>
:root{--bg:#0c0b10;--panel:#15141b;--panel2:#1d1b25;--line:#2a2733;--line2:#3a3645;--text:#f3f1f7;--muted:#9d97ab;--dim:#6e6880;
  --accent:#ff4d5e;--good:#43d39e;--bad:#ff6b6b;--love:#ffb547;--seen:#7aa2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:480px;margin:0 auto;padding:14px 18px 26px}
h1,h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.4px;margin:0}
h1{font-size:54px;line-height:.92}h2{font-size:34px;line-height:1}
.sub{color:var(--muted);margin:6px 0 18px;font-size:15px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.wordmark{font-family:'Bebas Neue';font-size:26px;letter-spacing:1.5px;display:flex;align-items:center;gap:8px}
.wordmark i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.accent{color:var(--accent)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-weight:600;font-size:16px;background:var(--accent);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center}.spacer{flex:1}
.textbtn{color:var(--muted);font-size:14px;font-weight:500;padding:8px 0}
.pill{padding:7px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.pill b{color:var(--text);font-weight:600}
/* poster */
.poster{position:relative;overflow:hidden;display:flex;flex-direction:column;padding:18px;color:#fff;isolation:isolate}
.poster::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.16),transparent 55%);z-index:-1}
.poster .pk{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:.75}
.poster .pt{font-family:'Bebas Neue';font-size:46px;line-height:.9;margin-top:auto;letter-spacing:.3px;word-break:break-word}
.poster .rule{height:2px;width:34px;background:rgba(255,255,255,.7);margin:10px 0 8px}
.poster .pg{font-size:12.5px;opacity:.85;font-weight:500}
/* deck */
.deck{position:relative;height:470px;margin:14px 0 18px;touch-action:none;user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 20px 50px -25px #000;will-change:transform;touch-action:none}
.card.back{transform:scale(.95) translateY(14px);opacity:.6;pointer-events:none}
.card .poster{flex:1}
.card .info{padding:14px 16px 16px}
.card .info .meta{color:var(--muted);font-size:13px;margin-bottom:4px}
.card .info p{margin:0;font-size:14.5px;color:#ddd8e6}
.stamp{position:absolute;top:22px;padding:6px 12px;border:3px solid;border-radius:10px;font-family:'Bebas Neue';font-size:34px;letter-spacing:1px;opacity:0;z-index:5;pointer-events:none;background:rgba(12,11,16,.35)}
.stamp.nope{right:20px;color:var(--bad);border-color:var(--bad);transform:rotate(12deg)}
.stamp.into{left:20px;color:var(--good);border-color:var(--good);transform:rotate(-12deg)}
.stamp.loved{left:50%;top:40%;transform:translateX(-50%);color:var(--love);border-color:var(--love)}
.stamp.seen{left:50%;top:40%;transform:translateX(-50%);color:var(--seen);border-color:var(--seen)}
.qcard{background:linear-gradient(165deg,#2a2236 0%,#1a1622 60%,#121018 100%)}
.qbody{flex:1;display:flex;flex-direction:column;padding:26px 22px}
.qbody .pk{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.qt{font-family:'Bebas Neue';font-size:52px;line-height:.95;margin:auto 0;letter-spacing:.3px}
.qsides{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:10px}
.qsides span:first-child{color:var(--bad)}.qsides span:last-child{color:var(--good)}
.qhint{font-size:13px;color:var(--muted);text-align:center;white-space:pre}
.how p{color:#d9d5e2;font-size:15px;margin:0 0 14px}.how b{color:var(--text)}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.ctl .c{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);transition:transform .1s}
.ctl:active .c{transform:scale(.9)}
.ctl svg{width:24px;height:24px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ctl.nope svg{stroke:var(--bad)}.ctl.seen svg{stroke:var(--seen)}.ctl.loved svg{stroke:var(--love)}.ctl.into svg{stroke:var(--good)}
.ctl.into .c{background:#12261f;border-color:#235c46}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--accent)}
.hint{font-size:12.5px;color:var(--dim);text-align:center;margin-top:14px}
/* suggestions */
.sug{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;animation:rise .3s ease both;transition:opacity .25s,transform .25s}
.sug.gone{opacity:0;transform:translateX(-30px);pointer-events:none}
.sug .poster{border-radius:10px;padding:8px;aspect-ratio:2/3}
.sug .poster .pt{font-size:18px}.sug .poster .pk,.sug .poster .pg,.sug .poster .rule{display:none}
.sug h4{margin:0;font-size:17px;line-height:1.2}
.sug .meta{color:var(--muted);font-size:12.5px;margin:3px 0 6px}
.sug p{margin:0 0 8px;font-size:13.5px;color:#d9d5e2}
.why{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.why span{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:#d6d0e4}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{padding:10px;border-radius:10px;font-weight:600;font-size:14px}
.yn .y{background:var(--good);color:#06140e}.yn .n{background:var(--panel2);border:1px solid var(--line)}
.svc{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#fff;color:#111;display:inline-block;margin-bottom:8px}
.svc.unknown{background:transparent;color:var(--dim);font-weight:500;border:1px solid var(--line)}
/* chips / settings */
.group{margin:0 0 22px}
.group h3{font-size:12.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.group .hintline{font-size:12.5px;color:var(--dim);margin:-6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:500;line-height:1.2}
.chip.on{background:var(--text);color:#111;border-color:var(--text)}
.chip.love{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.avoid,.chip.neg.on{border-color:var(--bad);color:var(--bad);background:transparent}
.chip.avoid{text-decoration:line-through}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px}
input[type=text]:focus{outline:none;border-color:var(--line2)}
.inputrow{display:flex;gap:8px;margin-bottom:12px}.inputrow .btn{width:auto;padding:0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.stat b{display:block;font-family:'Bebas Neue';font-size:30px;font-weight:400;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.cta{display:grid;gap:10px}
.enjoy .poster{border-radius:20px;aspect-ratio:3/4;margin:10px 0 18px}
.fade{animation:fade .25s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--text);color:#111;padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--dim);text-align:center;margin-top:18px}
.listrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.listrow span{flex:1}
.listrow button{font-size:12.5px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
</style>
</head>

const jacc=(a,b)=>{const A=new Set(a),i=b.filter(x=>A.has(x)).length;return i/(new Set([...a,...b]).size||1)};
const uniqPush=(a,v)=>{if(!a.includes(v))a.push(v)};

/* ===== engine ===== */
let S=null; // session
function newSession(){S={vec:{},shown:[],wants:[],offered:[],out:[],swipes:0,sinceSug:0,history:[],asked:[],said:{}}}
function eligible(t){
  const cap=(AUDS.find(a=>a[0]===store.aud)||AUDS[0])[2];
  if(CERTS[t.c]>cap)return false;
  if(store.fmt==='movie'&&t.k!=='M')return false;
  if(store.fmt==='series'&&t.k!=='S')return false;
  if(P().deal.some(d=>t.tags.includes(d)))return false;
  if(store.seen.includes(t.id)||store.loved.includes(t.id)||store.nope.includes(t.id)||store.chosen.includes(t.id))return false;
  if(S&&S.out.includes(t.id))return false;
  return true;
}
function score(t){
  const p=P(),why=[];let s=0;
  for(const k of t.tags)s+=(S?S.vec[k]||0:0)+.6*(store.taste[k]||0);
  s/=Math.sqrt(t.tags.length||1);
  for(const k of t.tags){
    if(p.genres[k]===1){s+=1.5;why.push([1.5,LABEL[k]])}if(p.genres[k]===-1)s-=3;
    if(p.stories[k]===1){s+=1.4;why.push([1.4,LABEL[k]])}if(p.stories[k]===-1)s-=2.5;
  }
  for(const sp of p.sports)if(t.tags.includes(sp)){s+=2.5;why.push([3,LABEL[sp]])}
  for(const a of t.actors){if(p.actors.includes(a)){s+=3;why.push([4,a])}if((store.actorNo||[]).includes(a))s-=1.2}
  if(S&&S.said)for(const k of t.tags)if(S.said[k])why.push([3.2,'You said '+S.said[k].toLowerCase()]);
  let best=null,bo=0;for(const id of store.loved){const o=jacc(TITLES[id].tags,t.tags);if(o>bo){bo=o;best=TITLES[id]}}
  if(bo>=.34){s+=bo*3.5;why.push([3.5,'Like '+best.t])}
  if(S)for(const id of S.wants){const o=jacc(TITLES[id].tags,t.tags);if(o>=.4){s+=o*1.5;if(id!==t.id)why.push([2,'Like '+TITLES[id].t]);break}}
  if(p.services.length&&t.svc){if(p.services.includes(t.svc)){s+=.8;why.push([.6,'On '+t.svc])}else s-=2.5}
  const top=Object.entries(S?S.vec:{}).filter(([k,v])=>v>.9&&t.tags.includes(k)&&LABEL[k]).sort((a,b)=>b[1]-a[1]).slice(0,2);
  top.forEach(([k,v])=>why.push([v*.5,LABEL[k]]));
  const seenW=new Set();
  const said=new Set(why.filter(w=>w[1].startsWith('You said ')).map(w=>w[1].slice(9)));
  return {t,s,why:why.sort((a,b)=>b[0]-a[0]).filter(w=>!said.has(w[1].toLowerCase())&&!seenW.has(w[1])&&seenW.add(w[1])).slice(0,3).map(w=>w[1])};
}
const ranked=filter=>TITLES.filter(t=>eligible(t)&&(!filter||filter(t))).map(score).sort((a,b)=>b.s-a.s);

function nextCard(){
  const pool=ranked(t=>!S.shown.includes(t.id)&&!S.wants.includes(t.id));
  if(!pool.length)return null;
  const recent=S.shown.slice(-4).map(id=>TITLES[id]);
  const explore=S.swipes<3||Math.random()<.35;
  if(explore){ // something different from what you've just seen, but not a dud
    const cand=pool.slice(0,40);let best=cand[0],bv=-1e9;
    cand.forEach((r,i)=>{const sim=recent.reduce((m,o)=>Math.max(m,jacc(o.tags,r.t.tags)),0);const v=-sim*2-i*.03+Math.random()*.6;if(v>bv){bv=v;best=r}});
    return best.t;
  }
  const top=pool.slice(0,6),mx=top[0].s,ws=top.map(r=>Math.exp((r.s-mx)/1.2));
  let x=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<top.length;i++){x-=ws[i];if(x<=0)return top[i].t}
  return top[0].t;
}

const MOODQ=[
  {id:'m1',text:'Tonight you want to…',l:['Laugh',{comedy:2,feelgood:1}],r:['Be on edge',{tension:2,crime:1,mystery:.5}]},
  {id:'m2',text:'Light or heavy?',l:['Light & easy',{feelgood:1.5,comedy:1,dark:-1.2}],r:['Dark & intense',{dark:1.5,grit:1,tension:1}]},
  {id:'m3',text:'What pace?',l:['Slow burn',{slow:1.5,mind:.5,fast:-.8}],r:['Fast & loud',{fast:1.5,action:1.2,slow:-1}]},
  {id:'m4',text:'Real or made up?',l:['True story',{real:2}],r:['Pure escapism',{fantasy:1.5,scifi:1.2,real:-.5}]},
  {id:'m5',text:'Use your brain?',l:['Switch off',{mind:-1.5,comedy:.6,action:.6}],r:['Make me think',{mind:2,mystery:.8}]},
  {id:'m6',text:'Want to feel something?',l:['Keep it fun',{comedy:1,emotion:-.6}],r:['Hit me in the feels',{emotion:2,real:.5}]},
  {id:'m7',text:'Who\'s it for?',l:['Just grown-ups',{family:-1.5}],r:['Whole family',{family:2.5,gore:-3}]}
];
const QTEXT={genre:k=>`Up for some ${LABEL[k].toLowerCase()}?`,story:k=>`In the mood for ${({underdog:'an underdog story',revenge:'a revenge story',heist:'a heist',survival:'a survival story',timetravel:'time travel',spy:'spies',mind:'twists',comingofage:'a coming-of-age story',familydrama:'family drama',superhero:'superheroes',space:'something set in space',conspiracy:'dark secrets'})[k]||LABEL[k]}?`,
  sport:k=>`Into ${LABEL[k].toLowerCase()}?`,actor:k=>`Like watching ${k}?`};
function makeQ(type,key){
  const tagW=type==='actor'?null:{[key]:1.6};
  return {q:true,id:type+':'+key,type,key,text:QTEXT[type](key),
    l:['No',tagW?{[key]:-1.6}:null],r:['Yes',tagW],u:[type==='actor'?'Love them':'Love it',tagW?{[key]:2.4}:null],d:['Skip',null]};
}
function nextQuestion(){
  S.asked=S.asked||[];
  const nq=S.asked.length;
  // open with two mood questions, then mix in one every few cards
  const moodLeft=MOODQ.filter(m=>!S.asked.includes(m.id)&&!(m.id==='m7'&&store.aud!=='adults'&&store.aud!=='kids'));
  if((nq<2||nq%3===2)&&moodLeft.length){const m=moodLeft[Math.random()*Math.min(3,moodLeft.length)|0];return {q:true,mood:true,...m,u:['Either',null],d:['Skip',null]}}
  // otherwise ask whatever best splits your current shortlist
  const top=ranked(t=>!S.shown.includes(t.id)).slice(0,24).map(r=>r.t);if(top.length<4)return null;
  const p=P(),cands=[];
  const consider=(type,key,has)=>{if(S.asked.includes(type+':'+key))return;const f=top.filter(has).length/top.length;if(f<.12||f>.88)return;cands.push({type,key,v:1-Math.abs(f-.5)*2+Math.random()*.25})};
  GENRES.forEach(([k])=>p.genres[k]===undefined&&consider('genre',k,t=>t.tags.includes(k)));
  STORIES.forEach(([k])=>p.stories[k]===undefined&&consider('story',k,t=>t.tags.includes(k)));
  SPORTS.forEach(([k])=>!p.sports.includes(k)&&consider('sport',k,t=>t.tags.includes(k)));
  const acts=[...new Set(top.flatMap(t=>t.actors))].filter(a=>!p.actors.includes(a)&&!(store.actorNo||[]).includes(a));
  acts.forEach(a=>{if(S.asked.includes('actor:'+a))return;const f=top.filter(t=>t.actors.includes(a)).length/top.length;if(f>=.08)cands.push({type:'actor',key:a,v:.55+f+Math.random()*.35})});
  if(!cands.length)return null;
  cands.sort((x,y)=>y.v-x.v);return makeQ(cands[0].type,cands[0].key);
}
function nextItem(){
  const wantQ=S.swipes===0||(S.swipes%3===0);
  if(wantQ){const q=nextQuestion();if(q)return q}
  return nextCard();
}

function cardHTML(t,cls){return `<div class="card ${cls}" ${cls==='front'?'id="front"':''}>
  <div class="stamp nope">Nope</div><div class="stamp into">Into it</div><div class="stamp loved">Loved it</div><div class="stamp seen">Seen it</div>

function qHTML(q){

  return `<div class="card qcard" id="front">

    <div class="qbody"><div class="pk">Quick question · ${kind}</div><div class="qt">${h(q.text)}</div>
      ${q.mood?`<div class="qsides"><span>← ${h(q.l[0])}</span><span>${h(q.r[0])} →</span></div>`:`<div class="qsides"><span>← No</span><span>Yes →</span></div>`}
      <div class="qhint">↑ ${h(q.u[0])}   ·   ↓ ${h(q.d[0])}</div></div></div>`}

function bindDrag(){
  const el=$('#front');if(!el)return;
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const stamps={nope:el.querySelector('.stamp.nope'),into:el.querySelector('.stamp.into'),loved:el.querySelector('.stamp.loved'),seen:el.querySelector('.stamp.seen')};
  const dir=()=>Math.abs(dx)>Math.abs(dy)?(dx>0?'into':'nope'):(dy<0?'loved':'seen');
  el.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;dx=dy=0;el.style.transition='none';try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;dy=e.clientY-sy;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx*.05}deg)`;
    const d=dir(),amt=Math.min(1,Math.max(Math.abs(dx),Math.abs(dy))/110);
    for(const k in stamps)stamps[k].style.opacity=k===d?amt:0});
  const end=()=>{if(!drag)return;drag=false;
    if(Math.max(Math.abs(dx),Math.abs(dy))>95)fling(dir());
    else{el.style.transition='transform .25s';el.style.transform='';for(const k in stamps)stamps[k].style.opacity=0}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function fling(kind){
  const el=$('#front');if(!el||S.busy)return;S.busy=true;
  const v={nope:[-600,0],into:[600,0],loved:[0,-700],seen:[0,700]}[kind];
  el.querySelector('.stamp.'+kind).style.opacity=1;
  el.style.transition='transform .28s ease-in';el.style.transform=`translate(${v[0]}px,${v[1]}px) rotate(${v[0]*.04}deg)`;
  setTimeout(()=>{S.busy=false;swipe(kind)},230);
}
ACT.sw=v=>fling(v);
function addW(v,w,f=1){if(w)for(const k in w)v[k]=(v[k]||0)+w[k]*f}
function swipe(kind){
  const c=S.cur;S.swipes++;S.sinceSug++;
  S.history.push({item:c,kind,vec:{...S.vec},taste:{...store.taste},profile:JSON.parse(JSON.stringify(P())),said:{...S.said},actorNo:(store.actorNo||[]).slice()});
  if(c.q){
    S.asked.push(c.id);
    const side={nope:c.l,into:c.r,loved:c.u,seen:c.d}[kind];
    if(c.mood){addW(S.vec,side[1]);if(kind==='nope'||kind==='into')S.said[c.id]=side[0]}
    else if(c.type==='actor'){
      if(kind==='into'||kind==='loved'){uniqPush(P().actors,c.key);S.said['a:'+c.key]=c.key}
      if(kind==='nope'){store.actorNo=store.actorNo||[];uniqPush(store.actorNo,c.key)}
    } else {
      addW(S.vec,side[1]);
      if(kind==='into'||kind==='loved')S.said[c.key]=LABEL[c.key];
      if(kind==='loved'){if(c.type==='genre')P().genres[c.key]=1;if(c.type==='story')P().stories[c.key]=1;if(c.type==='sport')uniqPush(P().sports,c.key)}
      if(kind==='nope'&&c.type==='sport')S.vec.sport=(S.vec.sport||0)-.5;
    }
  } else {
    const t=c;S.shown.push(t.id);
    if(kind==='into'){add(S.vec,t.tags,1);add(store.taste,t.tags,.2);S.wants.push(t.id)}
    if(kind==='nope'){add(S.vec,t.tags,-.6);add(store.taste,t.tags,-.15);uniqPush(store.nope,t.id)}
    if(kind==='loved'){add(S.vec,t.tags,.8);add(store.taste,t.tags,.45);uniqPush(store.loved,t.id)}
    if(kind==='seen'){add(S.vec,t.tags,-.15);add(store.taste,t.tags,-.05);uniqPush(store.seen,t.id)}
  }
  save();
  const nxt=S.nxt;S.nxt=null;
  S.cur=null;
  if(S.sinceSug>=ROUND)return suggest();
  const wantQ=S.swipes%3===0;
  S.cur=wantQ?nextQuestion():null;
  if(!S.cur)S.cur=nxt&&!nxt.q&&eligible(nxt)&&!S.shown.includes(nxt.id)&&!S.wants.includes(nxt.id)?nxt:nextCard();
  if(!S.cur)return suggest();
  deck();
}
ACT.undo=()=>{const last=S.history.pop();if(!last)return;
  const c=last.item;S.vec=last.vec;store.taste=last.taste;store.profile=last.profile;S.said=last.said;store.actorNo=last.actorNo;
  if(c.q)remove(S.asked,c.id);else{remove(S.shown,c.id);remove(S.wants,c.id);remove(store.nope,c.id);remove(store.loved,c.id);remove(store.seen,c.id)}
  S.swipes--;S.sinceSug=Math.max(0,S.sinceSug-1);save();S.nxt=null;S.cur=c;deck()};
ACT.sugnow=()=>suggest();
ACT.aud=()=>{const i=AUDS.findIndex(a=>a[0]===store.aud);store.aud=AUDS[(i+1)%AUDS.length][0];save();if(!S.cur.q&&!eligible(S.cur))S.cur=nextCard();S.nxt=null;deck()};
ACT.fmt=()=>{const i=FMTS.findIndex(a=>a[0]===store.fmt);store.fmt=FMTS[(i+1)%FMTS.length][0];save();if(!S.cur.q&&!eligible(S.cur))S.cur=nextCard();S.nxt=null;deck()};

/* ===== suggestions ===== */
function suggest(empty){
  S.sinceSug=0;
  // titles you swiped "into it" come first, then the best unseen matches
  const wants=S.wants.filter(id=>!S.offered.includes(id)&&eligible(TITLES[id])).map(id=>score(TITLES[id])).sort((a,b)=>b.s-a.s);
  const rest=ranked(t=>!S.offered.includes(t.id)&&!S.wants.includes(t.id)&&!S.shown.includes(t.id));
  const picks=[];
  for(const r of [...wants.slice(0,2),...rest]){if(picks.length>=3)break;if(picks.some(p=>jacc(p.t.tags,r.t.tags)>.75&&!S.wants.includes(r.t.id)))continue;picks.push(r)}
  if(!picks.length){render(`<h2>You've been through the lot</h2><p class="sub">Nothing left in the sample catalogue that fits. Try changing who's watching or film/series.</p><button class="btn" data-act="home">Home</button>`);return}
  picks.forEach(r=>S.offered.push(r.t.id));
  S.picks=picks.map(r=>r.t.id);
  render(`<div class="row"><button class="textbtn" data-act="home">Home</button><span class="spacer"></span><span class="pill">Round ${S.offered.length/3|0}</span></div>
    <h2 style="margin-top:8px">How about one of these?</h2><p class="sub">Yes to watch it. No and it's gone.</p>
    ${picks.map(r=>`<div class="sug" id="s${r.t.id}">${poster(r.t)}<div>
      <h4>${h(r.t.t)}</h4><div class="meta">${r.t.k==='M'?'Film':'Series'} · ${r.t.y} · ${r.t.c} · ${runtime(r.t)}</div>
      ${svcTag(r.t)}<p>${h(r.t.blurb)}</p>
      ${r.why.length?`<div class="why">${r.why.map(w=>`<span>${h(w)}</span>`).join('')}</div>`:''}
      <div class="yn"><button class="n" data-act="no" data-v="${r.t.id}">No</button><button class="y" data-act="yes" data-v="${r.t.id}">Yes</button></div>
    </div></div>`).join('')}
    <button class="btn ghost" data-act="keep">None of these, keep swiping</button>
    <button class="textbtn" data-act="how" style="display:block;margin:14px auto 0">How are these picked?</button>`);
}
ACT.no=v=>{const id=+v,t=TITLES[id];S.out.push(id);add(S.vec,t.tags,-.4);add(store.taste,t.tags,-.08);save();
  const el=$('#s'+id);el.classList.add('gone');setTimeout(()=>{el.remove();S.picks=S.picks.filter(x=>x!==id);if(!S.picks.length){toast('No worries, a few more swipes');ACT.keep()}},250)};
ACT.keep=()=>{S.picks.forEach(id=>S.out.push(id));S.cur=nextQuestion()||nextCard();S.nxt=null;deck()};
ACT.yes=v=>{const t=TITLES[+v];uniqPush(store.chosen,t.id);add(store.taste,t.tags,.35);save();enjoy(t)};

function enjoy(t){
  render(`<div class="enjoy"><div class="eyebrow" style="margin-top:6px">Tonight you're watching</div>${poster(t)}
    <h2>${h(t.t)}</h2><div class="sub" style="margin:6px 0 10px">${t.k==='M'?'Film':'Series'} · ${t.y} · ${t.c} · ${runtime(t)}</div>${svcTag(t)}
    <p style="color:#d9d5e2;margin:6px 0 24px">${h(t.blurb)}</p>
    <div class="cta"><button class="btn" data-act="home">Done</button><button class="btn ghost" data-act="go">Pick something else</button></div>
    <p class="note">It's saved to your picks, so it won't be suggested again.</p></div>`);
  S=null;
}

/* ===== how it picks ===== */
ACT.how=()=>{const back=S&&S.picks?'back':'home';
  render(`<div class="row"><button class="textbtn" data-act="${back==='back'?'howBack':'home'}">Back</button></div>
  <div class="how"><h2 style="margin:6px 0 16px">How it picks</h2>
  <p>Every title is tagged: genres, vibe, storyline, sport, cast, rating and where it streams. Every swipe and answer adds or takes points from those tags. The highest-scoring titles you haven't seen become your picks.</p>
  <p><b>Tonight's swipes count most.</b> Into it on a title or Yes to a question pushes similar titles up for this session. Nope pushes them down.</p>
  <p><b>Questions are chosen to split your shortlist.</b> If half your top matches star Tom Hardy, it asks about Tom Hardy. If half are thrillers, it asks about thrillers. One answer cuts the list roughly in half.</p>
  <p><b>Your long-term taste builds up slowly.</b> Loved it, Nope and every yes or no nudge it, so next time starts smarter. Loving an actor, genre or storyline saves it to Your taste.</p>
  <p><b>Things that always apply:</b> who's watching sets the age rating, the never-show-me list is filtered out, your services get a small boost, and anything you've seen, loved, picked or noped is never suggested again.</p>
  <p><b>Titles you swipe Into it on</b> go straight to the front of your next picks.</p></div>`)};
ACT.howBack=()=>{const ids=S.picks;S.offered=S.offered.filter(id=>!ids.includes(id));suggest()};

/* ===== surprise ===== */
ACT.surprise=keep=>{if(!S||keep!==true)newSession();const pool=ranked().slice(0,10);if(!pool.length)return toast('Nothing left to suggest');
  const mx=pool[0].s,ws=pool.map(r=>Math.exp((r.s-mx)/1.2));let x=Math.random()*ws.reduce((a,b)=>a+b,0),pick=pool[0];
  for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0){pick=pool[i];break}}
  S.offered.push(pick.t.id);S.picks=[pick.t.id];
  render(`<div class="row"><button class="textbtn" data-act="home">Home</button></div>
    <h2 style="margin-top:8px">Try this</h2><p class="sub">Picked at random from your best matches.</p>
    <div class="sug" id="s${pick.t.id}">${poster(pick.t)}<div><h4>${h(pick.t.t)}</h4><div class="meta">${pick.t.k==='M'?'Film':'Series'} · ${pick.t.y} · ${pick.t.c} · ${runtime(pick.t)}</div>${svcTag(pick.t)}<p>${h(pick.t.blurb)}</p>
    ${pick.why.length?`<div class="why">${pick.why.map(w=>`<span>${h(w)}</span>`).join('')}</div>`:''}
    <div class="yn"><button class="n" data-act="surpriseNo" data-v="${pick.t.id}">No</button><button class="y" data-act="yes" data-v="${pick.t.id}">Yes</button></div></div></div>
    <button class="btn ghost" data-act="go">Swipe instead</button>`)};
ACT.surpriseNo=v=>{const t=TITLES[+v];add(store.taste,t.tags,-.08);save();S.out.push(+v);ACT.surprise(true)};

/* ===== your taste ===== */
const tri=(o,k)=>o[k]===1?'love':o[k]===-1?'avoid':'';
const cyc=(o,k)=>{o[k]=o[k]===1?-1:o[k]===-1?undefined:1;if(o[k]===undefined)delete o[k]};
const chipList=(list,cls,act)=>`<div class="chips">${list.map(([k,l])=>`<button class="chip ${cls(k)}" data-act="${act}" data-v="${h(k)}">${h(l)}</button>`).join('')}</div>`;
let actorPool=[];
function taste(){
  const p=P(),cnt={};TITLES.forEach(t=>t.actors.forEach(a=>cnt[a]=(cnt[a]||0)+1));
  actorPool=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
  const y=window.scrollY;
  render(`<div class="row"><button class="textbtn" data-act="home">Done</button></div>
    <h2 style="margin-top:6px">Your taste</h2><p class="sub">All optional. Swiping teaches it anyway, this just gives it a head start.</p>
    <div class="group"><h3>Genres</h3><div class="hintline">Tap once to love, twice to avoid</div>${chipList(GENRES,k=>tri(p.genres,k),'g')}</div>
    <div class="group"><h3>Storylines</h3>${chipList(STORIES,k=>tri(p.stories,k),'st')}</div>
    <div class="group"><h3>Sport you're into</h3>${chipList(SPORTS,k=>p.sports.includes(k)?'on':'','sp')}</div>
    <div class="group"><h3>Actors you love</h3><div class="inputrow"><input type="text" data-inp="actorq" placeholder="Search or add a name"><button class="btn" data-act="addActor">Add</button></div><div id="acts"></div></div>
    <div class="group"><h3>Your services</h3>${chipList(SERVICES.map(s=>[s,s]),k=>p.services.includes(k)?'on':'','sv')}</div>
    <div class="group"><h3>Never show me</h3>${chipList(DEALS,k=>p.deal.includes(k)?'neg on':'neg','dl')}</div>`);
  drawActors('');try{window.scrollTo(0,y)}catch(e){}
}
function drawActors(q){
  const p=P(),ql=q.toLowerCase().trim();
  const list=actorPool.filter(a=>!p.actors.includes(a)&&(!ql||a.toLowerCase().includes(ql))).slice(0,ql?30:18);
  $('#acts').innerHTML=`${p.actors.length?`<div class="chips" style="margin-bottom:10px">${p.actors.map(a=>`<button class="chip on" data-act="ac" data-v="${h(a)}">${h(a)} ✕</button>`).join('')}</div>`:''}
    <div class="chips">${list.map(a=>`<button class="chip" data-act="ac" data-v="${h(a)}">${h(a)}</button>`).join('')}</div>`;
}
const togA=(a,v)=>a.includes(v)?remove(a,v):a.push(v);
Object.assign(ACT,{
  taste,home,list:()=>listView(),
  go(){newSession();S.cur=nextItem();deck()},
  g(v){cyc(P().genres,v);save();taste()},st(v){cyc(P().stories,v);save();taste()},
  sp(v){togA(P().sports,v);save();taste()},sv(v){togA(P().services,v);save();taste()},dl(v){togA(P().deal,v);save();taste()},
  ac(v){togA(P().actors,v);save();drawActors(($('[data-inp=actorq]')||{}).value||'')},
  addActor(){const el=$('[data-inp=actorq]'),v=el.value.trim();if(!v)return;
    const m=actorPool.find(a=>a.toLowerCase()===v.toLowerCase())||v.replace(/\b\w/g,c=>c.toUpperCase());
    uniqPush(P().actors,m);save();el.value='';drawActors('')},
  unmark(v){const [k,id]=v.split(':');remove(store[k],+id);save();listView()}
});

/* ===== list ===== */
function listView(){
  const sec=(k,title)=>`<div class="group"><h3>${title} · ${store[k].length}</h3>${store[k].length?store[k].slice().reverse().map(id=>`<div class="listrow"><span>${h(TITLES[id].t)}</span><button data-act="unmark" data-v="${k}:${id}">Remove</button></div>`).join(''):'<p class="sub" style="margin:0">Nothing yet.</p>'}</div>`;
  render(`<div class="row"><button class="textbtn" data-act="home">Done</button></div>
    <h2 style="margin-top:6px">Your history</h2><p class="sub">None of these get suggested. Remove one to let it come back.</p>
    ${sec('chosen','Picked to watch')}${sec('loved','Loved')}${sec('seen','Seen')}${sec('nope','Not for me')}`);
}

home();
</script>
</body>
</html>
